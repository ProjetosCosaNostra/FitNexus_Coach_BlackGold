name: Stage52 Student Issuance Target Privacy Promotion

on:
  pull_request:
    paths:
      - '04_backend_supabase/migrations/20260824203000_stage52_student_issuance_target_privacy_hardening.sql'
      - '04_backend_supabase/migration_ledger_authority.json'
      - '04_backend_supabase/stage52_student_issuance_target_privacy_candidate_authority.json'
      - '04_backend_supabase/stage52_student_issuance_target_privacy_promotion_authority.json'
      - '04_backend_supabase/stage52_student_issuance_target_privacy_final_authority.json'
      - '04_backend_supabase/operations/stage52_student_issuance_target_privacy_candidate.sql'
      - '04_backend_supabase/tools/stage52_student_issuance_migration_frontier.py'
      - '04_backend_supabase/tools/verify_stage52_student_issuance_target_privacy_candidate.py'
      - '04_backend_supabase/tools/verify_stage52_candidate_historical_compat.py'
      - '04_backend_supabase/tools/verify_stage52_student_issuance_target_privacy_promotion.py'
      - '04_backend_supabase/tools/verify_stage52_promotion_historical_compat.py'
      - '04_backend_supabase/stage51_security_definer_advisor_reconciliation_authority.json'
      - '04_backend_supabase/tools/verify_stage51_security_definer_advisor_reconciliation.py'
      - '04_backend_supabase/security_definer_exposure_authority.json'
      - '04_backend_supabase/tools/verify_security_definer_exposure_authority.py'
      - '04_backend_supabase/tools/verify_student_access_issuance_authority.py'
      - '04_backend_supabase/tools/verify_student_access_security_contract.py'
      - '.github/workflows/stage52_student_issuance_target_privacy_promotion.yml'
  push:
    branches:
      - 'blackgold/stage52-*'
    paths:
      - '04_backend_supabase/migrations/20260824203000_stage52_student_issuance_target_privacy_hardening.sql'
      - '04_backend_supabase/migration_ledger_authority.json'
      - '04_backend_supabase/stage52_student_issuance_target_privacy_promotion_authority.json'
      - '04_backend_supabase/stage52_student_issuance_target_privacy_final_authority.json'
      - '04_backend_supabase/tools/stage52_student_issuance_migration_frontier.py'
      - '04_backend_supabase/tools/verify_stage52_candidate_historical_compat.py'
      - '04_backend_supabase/tools/verify_stage52_student_issuance_target_privacy_promotion.py'
      - '04_backend_supabase/tools/verify_stage52_promotion_historical_compat.py'
      - '.github/workflows/stage52_student_issuance_target_privacy_promotion.yml'

permissions:
  contents: read

jobs:
  stage52-target-privacy-promotion:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Compile Stage52 promotion surfaces
        run: |
          python -m py_compile 04_backend_supabase/tools/stage52_student_issuance_migration_frontier.py
          python -m py_compile 04_backend_supabase/tools/verify_stage52_student_issuance_target_privacy_candidate.py
          python -m py_compile 04_backend_supabase/tools/verify_stage52_candidate_historical_compat.py
          python -m py_compile 04_backend_supabase/tools/verify_stage52_student_issuance_target_privacy_promotion.py
          python -m py_compile 04_backend_supabase/tools/verify_stage52_promotion_historical_compat.py

      - name: Verify Stage52 exact candidate migration promotion under historical projection
        run: python 04_backend_supabase/tools/verify_stage52_promotion_historical_compat.py

      - name: Verify sealed Stage52 candidate under historical projection
        run: python 04_backend_supabase/tools/verify_stage52_candidate_historical_compat.py

      - name: Verify Stage51 advisor reconciliation
        run: python 04_backend_supabase/tools/verify_stage51_security_definer_advisor_reconciliation.py

      - name: Verify SECURITY DEFINER exposure authority
        run: python 04_backend_supabase/tools/verify_security_definer_exposure_authority.py

      - name: Verify student access issuance authority
        run: python 04_backend_supabase/tools/verify_student_access_issuance_authority.py

      - name: Verify student access security contract
        run: python 04_backend_supabase/tools/verify_student_access_security_contract.py

      - name: Verify migration ledger authority
        run: python 04_backend_supabase/tools/verify_migration_ledger_contract.py

      - name: Verify Stage40 promotion historical compatibility
        run: python 04_backend_supabase/tools/verify_stage40_promotion_historical_compat.py

      - name: Verify Stage40 final reconciliation historical compatibility
        run: python 04_backend_supabase/tools/verify_stage40_final_historical_compat.py

      - name: Verify PostgreSQL view replacement compatibility
        run: python 04_backend_supabase/tools/verify_postgres_view_replace_compatibility.py
