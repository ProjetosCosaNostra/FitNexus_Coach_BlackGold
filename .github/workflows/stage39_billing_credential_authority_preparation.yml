name: Stage 39 Billing Credential Authority Preparation

on:
  pull_request:
    branches:
      - main
    paths:
      - '04_backend_supabase/stage39_billing_credential_authority_external_evidence_preparation.json'
      - '04_backend_supabase/tools/collect_stage39_billing_credential_evidence.ps1'
      - '04_backend_supabase/tools/verify_stage39_billing_credential_authority_preparation.py'
      - '04_backend_supabase/stage38_billing_evidence_bound_activation_final_authority.json'
      - '.github/workflows/stage39_billing_credential_authority_preparation.yml'

permissions:
  contents: read

jobs:
  verify-stage39-preparation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Compile Stage39 guard
        run: python -m py_compile 04_backend_supabase/tools/verify_stage39_billing_credential_authority_preparation.py

      - name: Parse Stage39 PowerShell collector without execution
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path '04_backend_supabase/tools/collect_stage39_billing_credential_evidence.ps1'),
            [ref]$null,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }
          Write-Host 'STAGE39_POWERSHELL_PARSE=PASS'

      - name: Stage39 billing credential authority preparation guard
        run: python 04_backend_supabase/tools/verify_stage39_billing_credential_authority_preparation.py

      - name: Stage38 final reconciliation guard remains green
        run: python 04_backend_supabase/tools/verify_stage38_billing_evidence_bound_activation_final_reconciliation.py

      - name: Migration ledger contract remains green
        run: python 04_backend_supabase/tools/verify_migration_ledger_contract.py

      - name: Billing provider contract remains green
        run: python 04_backend_supabase/tools/verify_billing_provider_contract.py

      - name: Controlled launch contract remains fail-closed
        run: python 04_backend_supabase/tools/verify_controlled_launch_admission_contract.py

      - name: External gate placeholders remain non-attestation
        run: python 04_backend_supabase/tools/verify_external_gate_evidence_placeholders.py
