name: Support Ops Protocol Remote Apply Gate V1

on:
  pull_request:
    branches:
      - main
    paths:
      - '04_backend_supabase/operations/SUPPORT_OPS_PROTOCOL_REMOTE_APPLY_GATE_V1.json'
      - '04_backend_supabase/operations/SUPPORT_OPS_PROTOCOL_REPO_ONLY_PROMOTION_V1.json'
      - '04_backend_supabase/migrations/20260827190000_support_ops_protocol.sql'
      - '04_backend_supabase/migration_ledger_authority.json'
      - '04_backend_supabase/tools/verify_support_ops_protocol_remote_apply_gate_v1.py'
      - '.github/workflows/support_ops_protocol_remote_apply_gate_v1.yml'
  push:
    branches:
      - 'blackgold/support-ops-protocol-remote-apply-gate-v1'
    paths:
      - '04_backend_supabase/operations/SUPPORT_OPS_PROTOCOL_REMOTE_APPLY_GATE_V1.json'
      - '04_backend_supabase/operations/SUPPORT_OPS_PROTOCOL_REPO_ONLY_PROMOTION_V1.json'
      - '04_backend_supabase/migrations/20260827190000_support_ops_protocol.sql'
      - '04_backend_supabase/migration_ledger_authority.json'
      - '04_backend_supabase/tools/verify_support_ops_protocol_remote_apply_gate_v1.py'
      - '.github/workflows/support_ops_protocol_remote_apply_gate_v1.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v6

      - name: Verify remote apply gate authority
        run: python 04_backend_supabase/tools/verify_support_ops_protocol_remote_apply_gate_v1.py

      - name: Preserve gate-only boundary
        shell: bash
        run: |
          grep -q '"remote_apply_authorized": false' 04_backend_supabase/operations/SUPPORT_OPS_PROTOCOL_REMOTE_APPLY_GATE_V1.json
          grep -q '"remote_apply_count": 0' 04_backend_supabase/operations/SUPPORT_OPS_PROTOCOL_REMOTE_APPLY_GATE_V1.json
          grep -q '"ad_hoc_execute_sql_allowed": false' 04_backend_supabase/operations/SUPPORT_OPS_PROTOCOL_REMOTE_APPLY_GATE_V1.json
          grep -q '"credit_percent_points": 0' 04_backend_supabase/operations/SUPPORT_OPS_PROTOCOL_REMOTE_APPLY_GATE_V1.json
          echo 'REMOTE_MUTATION=false'
          echo 'GMAIL_MUTATION=false'
          echo 'COMMERCIAL_PROGRESS_CREDIT=0'
