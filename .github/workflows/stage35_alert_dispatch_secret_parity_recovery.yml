name: Stage 35 Alert Dispatch Secret Parity Recovery

on:
  pull_request:
    branches:
      - main
    paths:
      - '04_backend_supabase/stage35_alert_dispatch_secret_parity_recovery_authority.json'
      - '04_backend_supabase/tools/verify_stage35_alert_dispatch_secret_parity_recovery.py'
      - '04_backend_supabase/tools/Invoke-Stage35AlertSecretBootstrapV5.ps1'
      - '04_backend_supabase/tools/verify_stage35_alert_secret_bootstrap_v5.py'
      - '.github/workflows/stage35_alert_dispatch_secret_parity_recovery.yml'
  push:
    branches:
      - 'blackgold/stage35-dispatch-secret-parity-recovery-trigger'
    paths:
      - '04_backend_supabase/stage35_alert_dispatch_secret_parity_recovery_trigger.json'

permissions:
  contents: read

jobs:
  verify-recovery-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Stage 35 dispatch-secret parity recovery static guard
        run: python 04_backend_supabase/tools/verify_stage35_alert_dispatch_secret_parity_recovery.py

      - name: Deprecated V5 fail-closed guard
        run: python 04_backend_supabase/tools/verify_stage35_alert_secret_bootstrap_v5.py

  recover-dispatch-secret-parity:
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/blackgold/stage35-dispatch-secret-parity-recovery-trigger' &&
      github.run_attempt == 1
    needs:
      - verify-recovery-contract
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      DISPATCH_TOKEN: ${{ secrets.STUDENT_ACCESS_ALERT_DISPATCH_TOKEN }}
    steps:
      - name: Checkout exact recovery trigger head
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2

      - name: Validate exact one-shot recovery trigger
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import json
          import subprocess
          from pathlib import Path

          trigger = Path('04_backend_supabase/stage35_alert_dispatch_secret_parity_recovery_trigger.json')
          expected_path = trigger.as_posix()

          def fail(message: str) -> None:
              raise SystemExit('STAGE35_DISPATCH_SECRET_PARITY_RECOVERY_TRIGGER=FAIL\n' + message)

          head = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          parent = subprocess.check_output(['git', 'rev-parse', 'HEAD^'], text=True).strip()
          changed = subprocess.check_output(['git', 'diff', '--name-only', 'HEAD^', 'HEAD'], text=True).splitlines()
          changed = [row.strip() for row in changed if row.strip()]
          if changed != [expected_path]:
              fail(f'unexpected trigger diff: {changed}')

          try:
              marker = json.loads(trigger.read_text(encoding='utf-8'))
          except Exception as exc:
              fail(f'trigger marker unreadable: {type(exc).__name__}')

          expected = {
              'schema_version': 1,
              'stage': 'STAGE35_ALERT_DISPATCH_SECRET_PARITY_RECOVERY_TRIGGER',
              'project_ref': 'mceukeondizkwlpfxzgf',
              'recovery_seal_main_sha': parent,
              'failed_external_proof_run': 32647288419,
              'failed_external_proof_job': 97213360238,
              'failed_external_proof_pr': 112,
              'provider_call_allowed': False,
              'external_delivery_proof_retry_allowed': False,
              'one_execution_only': True,
          }
          if marker != expected:
              fail('trigger marker content drifted')

          print('STAGE35_DISPATCH_SECRET_PARITY_RECOVERY_TRIGGER=PASS')
          print(f'RECOVERY_SEAL_MAIN_SHA={parent}')
          print(f'RECOVERY_TRIGGER_HEAD_SHA={head}')
          print('TRIGGER_DIFF_EXACT=true')
          print('PROVIDER_CALL_ALLOWED=false')
          print('EXTERNAL_DELIVERY_PROOF_RETRY_ALLOWED=false')
          PY

      - name: Validate recovery secrets without disclosure
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          import re

          def fail(code: str) -> None:
              raise SystemExit('STAGE35_DISPATCH_SECRET_RECOVERY_SECRET_GATE=FAIL\nCODE=' + code)

          management = os.environ.get('SUPABASE_ACCESS_TOKEN', '')
          dispatch = os.environ.get('DISPATCH_TOKEN', '')
          if not management:
              fail('SUPABASE_ACCESS_TOKEN_MISSING')
          if not dispatch:
              fail('STUDENT_ACCESS_ALERT_DISPATCH_TOKEN_MISSING')
          if not (32 <= len(dispatch) <= 256):
              fail('DISPATCH_TOKEN_LENGTH_INVALID')
          if any(ch in dispatch for ch in ('\r', '\n', '\x00')):
              fail('DISPATCH_TOKEN_MULTILINE_OR_NUL')
          normalized = dispatch.strip().lower()
          placeholders = {'redacted', 'masked', 'hidden', 'null', 'none', 'secret', 'changeme'}
          if normalized in placeholders or re.fullmatch(r'[\*xX•]+', dispatch.strip()):
              fail('DISPATCH_TOKEN_OBVIOUS_PLACEHOLDER')
          print('STAGE35_DISPATCH_SECRET_RECOVERY_SECRET_GATE=PASS')
          print('REQUIRED_SECRET_NAMES=2/2')
          print('SECRET_VALUES_PRINTED=false')
          print('SECRET_DIGESTS_PRINTED=false')
          PY

      - name: Restore exact GitHub dispatch token into Supabase runtime
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import json
          import os
          import urllib.error
          import urllib.request

          endpoint = 'https://api.supabase.com/v1/projects/mceukeondizkwlpfxzgf/secrets'
          access_token = os.environ['SUPABASE_ACCESS_TOKEN']
          dispatch_token = os.environ['DISPATCH_TOKEN']
          body = json.dumps([
              {'name': 'STUDENT_ACCESS_ALERT_DISPATCH_TOKEN', 'value': dispatch_token},
          ], separators=(',', ':')).encode('utf-8')
          request = urllib.request.Request(
              endpoint,
              data=body,
              method='POST',
              headers={
                  'authorization': f'Bearer {access_token}',
                  'content-type': 'application/json',
                  'accept': 'application/json',
                  'user-agent': 'FitNexus-Stage35-Dispatch-Secret-Parity-Recovery/1.0',
              },
          )
          try:
              with urllib.request.urlopen(request, timeout=30) as response:
                  status = response.status
                  response.read(4096)
          except urllib.error.HTTPError as exc:
              status = exc.code
              exc.read(4096)
          except urllib.error.URLError as exc:
              raise SystemExit('STAGE35_DISPATCH_SECRET_RUNTIME_WRITE=FAIL\nTRANSPORT=' + type(exc.reason).__name__)
          if status < 200 or status >= 300:
              raise SystemExit(f'STAGE35_DISPATCH_SECRET_RUNTIME_WRITE=FAIL\nHTTP_STATUS={status}')
          print('STAGE35_DISPATCH_SECRET_RUNTIME_WRITE=PASS')
          print('RUNTIME_SECRET_WRITTEN=STUDENT_ACCESS_ALERT_DISPATCH_TOKEN')
          print('TELEGRAM_BOT_TOKEN_ROTATED=false')
          print('TELEGRAM_CHAT_ID_ROTATED=false')
          print('SECRET_VALUES_PRINTED=false')
          PY

      - name: Prove dispatch-secret parity before claim or provider path
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import json
          import os
          import time
          import urllib.error
          import urllib.request

          endpoint = 'https://mceukeondizkwlpfxzgf.supabase.co/functions/v1/student-access-alert-dispatcher'
          dispatch_token = os.environ['DISPATCH_TOKEN']
          expected_error = 'ALERT_DISPATCH_BODY_FIELD_FORBIDDEN'

          def probe() -> tuple[int, dict]:
              body = json.dumps({'parity_probe': True}, separators=(',', ':')).encode('utf-8')
              request = urllib.request.Request(
                  endpoint,
                  data=body,
                  method='POST',
                  headers={
                      'content-type': 'application/json',
                      'accept': 'application/json',
                      'x-fitnexus-alert-dispatch-token': dispatch_token,
                      'user-agent': 'FitNexus-Stage35-Dispatch-Secret-Parity-Probe/1.0',
                  },
              )
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      status = response.status
                      raw = response.read(4096)
              except urllib.error.HTTPError as exc:
                  status = exc.code
                  raw = exc.read(4096)
              except urllib.error.URLError as exc:
                  return 0, {'transport': type(exc.reason).__name__}
              try:
                  value = json.loads(raw.decode('utf-8'))
              except Exception:
                  value = {}
              return status, value if isinstance(value, dict) else {}

          last_status = None
          last_error = None
          for attempt in range(1, 13):
              if attempt > 1:
                  time.sleep(2)
              status, value = probe()
              last_status = status
              last_error = value.get('error')
              if status == 400 and last_error == expected_error:
                  print('STAGE35_DISPATCH_SECRET_PARITY_RECOVERY=PASS')
                  print(f'PARITY_PROBE_ATTEMPT={attempt}')
                  print('PARITY_PROBE_HTTP_STATUS=400')
                  print('PARITY_PROBE_ERROR=ALERT_DISPATCH_BODY_FIELD_FORBIDDEN')
                  print('AUTH_GATE_PASSED=true')
                  print('BODY_REJECTED_BEFORE_CLAIM=true')
                  print('DATABASE_CLAIM_CALLED=false')
                  print('DELIVERY_RECEIPT_WRITTEN=false')
                  print('TELEGRAM_PROVIDER_CALLED=false')
                  print('SECRET_VALUES_PRINTED=false')
                  print('SECRET_DIGESTS_PRINTED=false')
                  print('EXTERNAL_DELIVERY_PROOF_RETRIED=false')
                  print('NEXT_ACTION=FRESH_REMOTE_RECEIPT_THEN_NEW_ONE_SHOT_TRIGGER')
                  raise SystemExit(0)
          raise SystemExit(
              'STAGE35_DISPATCH_SECRET_PARITY_RECOVERY=FAIL\n'
              f'LAST_HTTP_STATUS={last_status}\nLAST_ERROR={last_error}'
          )
          PY
