name: Support Ops Protocol Remote Apply Execution V1

on:
  pull_request:
    branches:
      - main
    paths:
      - '04_backend_supabase/operations/SUPPORT_OPS_PROTOCOL_REMOTE_APPLY_EXECUTION_V1.json'
      - '04_backend_supabase/migration_ledger_authority.json'
      - '04_backend_supabase/migrations/20260827190000_support_ops_protocol.sql'
      - '04_backend_supabase/tools/verify_support_ops_protocol_remote_apply_execution_v1.py'
      - '.github/workflows/support_ops_protocol_remote_apply_execution_v1.yml'
  push:
    branches:
      - 'blackgold/support-ops-protocol-remote-apply-execution-v1'
    paths:
      - '04_backend_supabase/operations/SUPPORT_OPS_PROTOCOL_REMOTE_APPLY_EXECUTION_V1.json'
      - '04_backend_supabase/migration_ledger_authority.json'
      - '04_backend_supabase/migrations/20260827190000_support_ops_protocol.sql'
      - '04_backend_supabase/tools/verify_support_ops_protocol_remote_apply_execution_v1.py'
      - '.github/workflows/support_ops_protocol_remote_apply_execution_v1.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v6

      - name: Verify Support Ops remote apply execution evidence
        run: python 04_backend_supabase/tools/verify_support_ops_protocol_remote_apply_execution_v1.py

      - name: Preserve remaining open boundary
        shell: bash
        run: |
          grep -q '"apply_count":1' 04_backend_supabase/operations/SUPPORT_OPS_PROTOCOL_REMOTE_APPLY_EXECUTION_V1.json
          grep -q '"completed":false' 04_backend_supabase/operations/SUPPORT_OPS_PROTOCOL_REMOTE_APPLY_EXECUTION_V1.json
          grep -q 'BLOCKED_BY_READ_ONLY_SQL_EXECUTION_CONTEXT' 04_backend_supabase/operations/SUPPORT_OPS_PROTOCOL_REMOTE_APPLY_EXECUTION_V1.json
          grep -q '"credit_percent_points":0' 04_backend_supabase/operations/SUPPORT_OPS_PROTOCOL_REMOTE_APPLY_EXECUTION_V1.json
          echo 'REMOTE_APPLY_RECORDED=true'
          echo 'LEDGER_RECONCILED=true'
          echo 'SYNTHETIC_IDEMPOTENCY=OPEN'
          echo 'GMAIL_MUTATION=false'
          echo 'PRODUCTION_DEPLOYMENT=false'
          echo 'COMMERCIAL_PROGRESS_CREDIT=0'
