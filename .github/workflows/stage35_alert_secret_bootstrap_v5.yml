name: Stage 35 Alert Secret Bootstrap V5

on:
  pull_request:
    paths:
      - '04_backend_supabase/tools/Invoke-Stage35AlertSecretBootstrapV5.ps1'
      - '04_backend_supabase/tools/verify_stage35_alert_secret_bootstrap_v5.py'
      - '.github/workflows/stage35_alert_secret_bootstrap_v5.yml'

permissions:
  contents: read

jobs:
  verify-v5:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse V5 PowerShell without executing it
        shell: pwsh
        run: |
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path '04_backend_supabase/tools/Invoke-Stage35AlertSecretBootstrapV5.ps1'), [ref]$null, [ref]$errors)
          if ($errors.Count -gt 0) { $errors | ForEach-Object { Write-Error $_ }; exit 1 }
      - name: Validate V5 readback reconciliation invariants
        run: python 04_backend_supabase/tools/verify_stage35_alert_secret_bootstrap_v5.py
