      - "04_backend_supabase/tools/COMMERCIAL_READINESS_MACROBLOCK_V1_CI_SYNC_TRIGGER.txt"
      - "04_backend_supabase/tools/COMMERCIAL_READINESS_EXTERNAL_FACT_PACK_V1.ps1"
      - "04_backend_supabase/tools/build_commercial_readiness_external_fact_pack_v1.py"
      - ".github/workflows/commercial_readiness_macroblock_v1.yml"
      - "10_compliance/drafts/COMPLIANCE_OPEN_DECISIONS.json"
