name: Stage 35 Alert Dispatch Secret Parity Recovery Receipt

on:
  pull_request:
    branches:
      - main
    paths:
      - '04_backend_supabase/stage35_alert_dispatch_secret_parity_recovery_receipt_authority.json'
      - '04_backend_supabase/stage35_alert_dispatch_secret_parity_recovery_authority.json'
      - '04_backend_supabase/tools/verify_stage35_alert_dispatch_secret_parity_recovery_receipt.py'
      - '04_backend_supabase/tools/verify_stage35_alert_dispatch_secret_parity_recovery.py'
      - '04_backend_supabase/tools/Invoke-Stage35AlertSecretBootstrapV5.ps1'
      - '04_backend_supabase/tools/verify_stage35_alert_secret_bootstrap_v5.py'
      - '.github/workflows/stage35_alert_dispatch_secret_parity_recovery.yml'
      - '.github/workflows/stage35_alert_dispatch_secret_parity_recovery_receipt.yml'
  push:
    branches:
      - main
      - 'blackgold/**'
    paths:
      - '04_backend_supabase/stage35_alert_dispatch_secret_parity_recovery_receipt_authority.json'
      - '04_backend_supabase/tools/verify_stage35_alert_dispatch_secret_parity_recovery_receipt.py'
      - '.github/workflows/stage35_alert_dispatch_secret_parity_recovery_receipt.yml'

permissions:
  contents: read

jobs:
  verify-parity-recovery-receipt:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Stage 35 dispatch-secret parity recovery receipt guard
        run: python 04_backend_supabase/tools/verify_stage35_alert_dispatch_secret_parity_recovery_receipt.py

      - name: Deprecated V5 remains fail-closed
        run: python 04_backend_supabase/tools/verify_stage35_alert_secret_bootstrap_v5.py
