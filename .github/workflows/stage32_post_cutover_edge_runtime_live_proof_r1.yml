name: Stage 32 Post-Cutover Edge Runtime Live Proof R1

on:
  pull_request:
    types: [ready_for_review, opened]
    branches:
      - main

permissions:
  contents: read

jobs:
  post-cutover-edge-live-proof-r1:
    if: >-
      (
        (
          github.event.action == 'ready_for_review' &&
          github.event.pull_request.number == 77 &&
          github.event.pull_request.head.ref == 'blackgold/stage32-post-cutover-live-proof-r1-candidate' &&
          github.event.pull_request.head.sha == '344433bf502b519563fe328ab71e59249766e3dd'
        ) ||
        (
          github.event.action == 'opened' &&
          github.event.pull_request.head.ref == 'blackgold/stage32-live-proof-r1-open-trigger' &&
          github.event.pull_request.head.sha == '65e35282aa0e004134807553545e0859512cdef6'
        )
      ) &&
      github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout exact sealed Stage 32 R1 proof head
        uses: actions/checkout@v6
        with:
          ref: 344433bf502b519563fe328ab71e59249766e3dd

      - name: Stage 32 R1 live proof candidate guard
        run: python 04_backend_supabase/tools/verify_student_access_stage32_live_proof_r1_candidate.py

      - name: Set up Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve dependencies
        working-directory: 03_app_flutter/fitnexus_app
        run: flutter pub get

      - name: Derive masked Stage 32 R1 synthetic proof token
        shell: bash
        run: |
          TOKEN="$(python - <<'PY'
          import hashlib
          print(hashlib.sha256(b'fitnexus-stage32-post-cutover-edge-runtime-proof-v1').hexdigest())
          PY
          )"
          echo "::add-mask::$TOKEN"
          echo "STAGE32_SYNTHETIC_TOKEN=$TOKEN" >> "$GITHUB_ENV"
          echo "STAGE32_POST_CUTOVER_LIVE_PROOF_ENABLED=1" >> "$GITHUB_ENV"
          echo "STAGE32_SUPABASE_URL=https://mceukeondizkwlpfxzgf.supabase.co" >> "$GITHUB_ENV"
          echo "STAGE32_SUPABASE_PUBLISHABLE_KEY=sb_publishable_aggqgASWuWfgBJAlrRKoeg_Gg2qnjHQ" >> "$GITHUB_ENV"

      - name: Execute sealed R1 production-singleton five-route proof once
        working-directory: 03_app_flutter/fitnexus_app
        run: flutter test test/student_access_stage32_post_cutover_live_edge_proof_test.dart --reporter expanded

      - name: Stage 32 R1 proof boundary receipt
        run: |
          echo 'STAGE32_POST_CUTOVER_EDGE_LIVE_PROOF_R1=COMPLETED'
          echo 'SEALED_PROOF_PR=77'
          echo 'SEALED_PROOF_HEAD=344433bf502b519563fe328ab71e59249766e3dd'
          echo 'OPEN_TRIGGER_HEAD=65e35282aa0e004134807553545e0859512cdef6'
          echo 'CONSUMED_R0_RUN=32508349425'
          echo 'CONSUMED_R0_REEXECUTION_ALLOWED=false'
          echo 'PRODUCTION_SINGLETON=StudentAccessTransport.instance'
          echo 'PRODUCTION_ACTIVE_TRANSPORT=edgeGateway'
          echo 'ROUTES_EXPECTED=5'
          echo 'AUTOMATIC_EDGE_TO_DIRECT_FALLBACK=false'
          echo 'DIRECT_RPC_GRANTS_CHANGED=false'
          echo 'DIRECT_RPC_PRIVILEGE_REVOCATION=false'
          echo 'REAL_CUSTOMER_DATA_USED=false'
          echo 'RAW_SYNTHETIC_TOKEN_PRINTED=false'
          echo 'PROOF_REEXECUTION_ALLOWED=false'
          echo 'CLEANUP_REQUIRED=true'
          echo 'POST_CUTOVER_ROLLBACK_PROOF_REQUIRED=true'
          echo 'LAUNCH_GATE_PROMOTION=DENIED'
