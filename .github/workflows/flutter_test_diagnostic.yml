name: Flutter Test Diagnostic

on:
  push:
    branches:
      - blackgold/mobile-home-premium-redesign-v1

permissions:
  contents: read

jobs:
  discover-tests:
    runs-on: ubuntu-latest
    outputs:
      files: ${{ steps.tests.outputs.files }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - id: tests
        name: Discover Flutter tests
        working-directory: 03_app_flutter/fitnexus_app
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import glob, json
          files = sorted(glob.glob('test/*_test.dart'))
          print('files=' + json.dumps(files, separators=(',', ':')))
          PY

  test-file:
    needs: discover-tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        file: ${{ fromJson(needs.discover-tests.outputs.files) }}
    name: Test ${{ matrix.file }}
    defaults:
      run:
        working-directory: 03_app_flutter/fitnexus_app
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Set up Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Resolve dependencies
        run: flutter pub get
      - name: Run isolated test file
        run: flutter test "${{ matrix.file }}"
