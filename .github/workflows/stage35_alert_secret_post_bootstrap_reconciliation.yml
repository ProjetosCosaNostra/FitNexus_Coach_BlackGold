name: Stage 35 Alert Secret Post-Bootstrap Reconciliation

on:
  pull_request:
    branches:
      - main
    paths:
      - '04_backend_supabase/stage35_alert_secret_post_bootstrap_reconciliation_contract_authority.json'
      - '04_backend_supabase/tools/verify_stage35_alert_secret_post_bootstrap_reconciliation_contract.py'
      - '.github/workflows/stage35_alert_secret_post_bootstrap_reconciliation.yml'
  push:
    branches:
      - blackgold/stage35-alert-secret-recheck
    paths:
      - '04_backend_supabase/stage35_alert_secret_post_bootstrap_recheck_trigger.json'

permissions:
  contents: read

jobs:
  verify-reconciliation-contract:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Stage 35 post-bootstrap reconciliation contract guard
        run: python 04_backend_supabase/tools/verify_stage35_alert_secret_post_bootstrap_reconciliation_contract.py

  reconcile-secret-names:
    if: github.event_name == 'push' && github.ref_name == 'blackgold/stage35-alert-secret-recheck'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact recheck head
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Validate exact recheck branch and trigger diff
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --prune
          python - <<'PY'
          from __future__ import annotations

          import json
          import subprocess
          from pathlib import Path

          marker_path = Path('04_backend_supabase/stage35_alert_secret_post_bootstrap_recheck_trigger.json')
          expected_path = marker_path.as_posix()
          bootstrap_main = '8e9eb268af5df0a94e57b93a997b7c4411f11607'

          def fail(message: str) -> None:
              raise SystemExit('STAGE35_ALERT_SECRET_RECHECK_TRIGGER_GUARD=FAIL\n' + message)

          current_main = subprocess.check_output(
              ['git', 'rev-parse', 'origin/main'], text=True
          ).strip()
          merge_base = subprocess.check_output(
              ['git', 'merge-base', 'HEAD', 'origin/main'], text=True
          ).strip()
          if merge_base != current_main:
              fail('recheck branch was not created fresh from current main')

          ancestor = subprocess.run(
              ['git', 'merge-base', '--is-ancestor', bootstrap_main, 'HEAD'],
              check=False,
          )
          if ancestor.returncode != 0:
              fail('merged bootstrap tooling main is not an ancestor')

          changed = subprocess.check_output(
              ['git', 'diff', '--name-only', 'origin/main...HEAD'], text=True
          ).splitlines()
          changed = [row.strip() for row in changed if row.strip()]
          if changed != [expected_path]:
              fail(f'recheck branch changed unexpected files: {changed}')

          try:
              marker = json.loads(marker_path.read_text(encoding='utf-8'))
          except Exception as exc:
              fail(f'trigger marker unreadable: {type(exc).__name__}')

          expected = {
              'schema_version': 1,
              'stage': 'STAGE35_ALERT_SECRET_POST_BOOTSTRAP_RECHECK_TRIGGER',
              'project_ref': 'mceukeondizkwlpfxzgf',
              'bootstrap_tooling_main_sha': bootstrap_main,
              'secret_values_present': False,
              'provider_call_authorized': False,
              'launch_gate_promotion': False,
          }
          if marker != expected:
              fail('trigger marker content drifted')

          print('STAGE35_ALERT_SECRET_RECHECK_TRIGGER_GUARD=PASS')
          print(f'CURRENT_MAIN_SHA={current_main}')
          print('TRIGGER_DIFF_EXACT=true')
          print('SECRET_VALUES_PRESENT=false')
          print('PROVIDER_CALL_AUTHORIZED=false')
          print('LAUNCH_GATE_PROMOTION=DENIED')
          PY

      - name: Require all GitHub Actions secret names without printing values
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN_VALUE: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          DISPATCH_TOKEN_VALUE: ${{ secrets.STUDENT_ACCESS_ALERT_DISPATCH_TOKEN }}
          TELEGRAM_BOT_TOKEN_VALUE: ${{ secrets.STUDENT_ACCESS_ALERT_TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID_VALUE: ${{ secrets.STUDENT_ACCESS_ALERT_TELEGRAM_CHAT_ID }}
        run: |
          set -euo pipefail
          missing=0
          require_present() {
            local name="$1"
            local value="$2"
            if [[ -z "${value:-}" ]]; then
              echo "${name}=MISSING"
              missing=1
            else
              echo "${name}=PRESENT"
            fi
          }

          require_present 'SUPABASE_ACCESS_TOKEN' "${SUPABASE_ACCESS_TOKEN_VALUE:-}"
          require_present 'STUDENT_ACCESS_ALERT_DISPATCH_TOKEN' "${DISPATCH_TOKEN_VALUE:-}"
          require_present 'STUDENT_ACCESS_ALERT_TELEGRAM_BOT_TOKEN' "${TELEGRAM_BOT_TOKEN_VALUE:-}"
          require_present 'STUDENT_ACCESS_ALERT_TELEGRAM_CHAT_ID' "${TELEGRAM_CHAT_ID_VALUE:-}"

          if [[ "$missing" -ne 0 ]]; then
            echo 'GITHUB_ACTIONS_SECRET_NAMES_4_OF_4=false'
            exit 1
          fi
          echo 'GITHUB_ACTIONS_SECRET_NAMES_4_OF_4=true'
          echo 'SECRET_VALUES_PRINTED=false'

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Require all Supabase Edge runtime secret names without logging list output
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          ERR_FILE="$(mktemp)"
          trap 'rm -f "$ERR_FILE"' EXIT

          if ! RUNTIME_SECRET_LIST="$(supabase secrets list --project-ref mceukeondizkwlpfxzgf 2>"$ERR_FILE")"; then
            echo 'SUPABASE_EDGE_RUNTIME_SECRET_LIST=FAIL'
            echo 'RAW_SECRET_LIST_OUTPUT_PRINTED=false'
            exit 1
          fi

          missing=0
          for name in \
            STUDENT_ACCESS_ALERT_DISPATCH_TOKEN \
            STUDENT_ACCESS_ALERT_TELEGRAM_BOT_TOKEN \
            STUDENT_ACCESS_ALERT_TELEGRAM_CHAT_ID
          do
            if printf '%s\n' "$RUNTIME_SECRET_LIST" | grep -Fq "$name"; then
              echo "${name}=PRESENT_IN_SUPABASE_EDGE_RUNTIME"
            else
              echo "${name}=MISSING_IN_SUPABASE_EDGE_RUNTIME"
              missing=1
            fi
          done
          unset RUNTIME_SECRET_LIST

          if [[ "$missing" -ne 0 ]]; then
            echo 'SUPABASE_EDGE_RUNTIME_SECRET_NAMES_3_OF_3=false'
            exit 1
          fi

          echo 'SUPABASE_EDGE_RUNTIME_SECRET_NAMES_3_OF_3=true'
          echo 'RAW_SECRET_LIST_OUTPUT_PRINTED=false'
          echo 'SECRET_VALUES_PRINTED=false'
          echo 'PROVIDER_CREDENTIAL_VALIDITY_PROVEN=false'
          echo 'TELEGRAM_PROVIDER_CALLED=false'
          echo 'DATABASE_MIGRATION_APPLIED=false'
          echo 'EDGE_FUNCTION_DEPLOYED=false'
          echo 'ONE_SHOT_EXTERNAL_DELIVERY_PROOF_CONSUMED=false'
          echo 'NEXT_ACTION=PROMOTE_CONTROLLED_FIXTURE_REPO_ONLY'
          echo 'INCIDENT_RESPONSE_GATE=DENIED'
          echo 'PRODUCTION_DEPLOYMENT_GATE=DENIED'
          echo 'PAID_MEDIA_GATE=DENIED'
