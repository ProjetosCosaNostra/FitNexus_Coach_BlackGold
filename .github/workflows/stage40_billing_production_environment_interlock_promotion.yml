name: Stage 40 Billing Production Environment Interlock Promotion

on:
  pull_request:
    branches:
      - main
    paths:
      - '04_backend_supabase/migration_ledger_authority.json'
      - '04_backend_supabase/migrations/20260824003000_stage40_billing_production_environment_interlock.sql'
      - '04_backend_supabase/stage40_billing_production_environment_interlock_promotion_authority.json'
      - '04_backend_supabase/tools/verify_stage40_billing_production_environment_interlock_promotion.py'
      - '.github/workflows/stage40_billing_production_environment_interlock_promotion.yml'

permissions:
  contents: read

jobs:
  verify-stage40-promotion:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Compile Stage40 promotion guard
        run: python -m py_compile 04_backend_supabase/tools/verify_stage40_billing_production_environment_interlock_promotion.py

      - name: Migration ledger contract guard
        run: python 04_backend_supabase/tools/verify_migration_ledger_contract.py

      - name: Stage40 exact migration promotion guard
        run: python 04_backend_supabase/tools/verify_stage40_billing_production_environment_interlock_promotion.py

      - name: Billing provider historical contract guard
        run: python 04_backend_supabase/tools/verify_billing_provider_contract.py

      - name: Controlled launch historical contract guard
        run: python 04_backend_supabase/tools/verify_controlled_launch_admission_contract.py

      - name: External gate placeholders remain non-attestation
        run: python 04_backend_supabase/tools/verify_external_gate_evidence_placeholders.py

      - name: PostgreSQL CREATE OR REPLACE VIEW compatibility guard
        run: python 04_backend_supabase/tools/verify_postgres_view_replace_compatibility.py
