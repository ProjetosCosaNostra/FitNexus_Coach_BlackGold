name: Stage 35 Alert Dispatch Secret Parity Attestation

on:
  pull_request:
    branches:
      - main
    types:
      - opened
    paths:
      - '04_backend_supabase/stage35_alert_dispatch_secret_parity_attestation_trigger.json'
      - '.github/workflows/stage35_alert_dispatch_secret_parity_attestation.yml'

permissions:
  contents: read

jobs:
  attest-dispatch-secret-parity:
    if: >-
      github.head_ref == 'blackgold/stage35-dispatch-secret-parity-attestation' &&
      github.event.pull_request.base.sha == 'ca298277ac4550fe69ef36f79c64f7bb1fcf78ef' &&
      github.run_attempt == 1
    runs-on: ubuntu-latest
    env:
      DISPATCH_TOKEN: ${{ secrets.STUDENT_ACCESS_ALERT_DISPATCH_TOKEN }}
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Checkout exact attestation head
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Validate exact provider-free attestation diff
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          marker_path = Path('04_backend_supabase/stage35_alert_dispatch_secret_parity_attestation_trigger.json')
          workflow_path = '.github/workflows/stage35_alert_dispatch_secret_parity_attestation.yml'
          changed = subprocess.check_output(
              ['git', 'diff', '--name-only', f"{os.environ['BASE_SHA']}...{os.environ['HEAD_SHA']}"],
              text=True,
          ).splitlines()
          changed = sorted(row.strip() for row in changed if row.strip())
          expected_files = sorted([marker_path.as_posix(), workflow_path])
          if changed != expected_files:
              raise SystemExit(f'STAGE35_PARITY_ATTESTATION_DIFF=FAIL\nFILES={changed}')
          marker = json.loads(marker_path.read_text(encoding='utf-8'))
          expected = {
              'schema_version': 1,
              'stage': 'STAGE35_ALERT_DISPATCH_SECRET_PARITY_ATTESTATION',
              'project_ref': 'mceukeondizkwlpfxzgf',
              'recovery_seal_main_sha': os.environ['BASE_SHA'],
              'failed_external_proof_run': 32647288419,
              'provider_call_allowed': False,
              'database_claim_allowed': False,
              'delivery_receipt_write_allowed': False,
          }
          if marker != expected:
              raise SystemExit('STAGE35_PARITY_ATTESTATION_MARKER=FAIL')
          print('STAGE35_PARITY_ATTESTATION_DIFF=PASS')
          print('PROVIDER_CALL_ALLOWED=false')
          print('DATABASE_CLAIM_ALLOWED=false')
          print('DELIVERY_RECEIPT_WRITE_ALLOWED=false')
          PY

      - name: Require GitHub dispatch credential without disclosure
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          token = os.environ.get('DISPATCH_TOKEN', '')
          if not token:
              raise SystemExit('STAGE35_PARITY_ATTESTATION_SECRET_GATE=FAIL\nMISSING=STUDENT_ACCESS_ALERT_DISPATCH_TOKEN')
          if not (32 <= len(token) <= 256):
              raise SystemExit('STAGE35_PARITY_ATTESTATION_SECRET_GATE=FAIL\nCODE=DISPATCH_TOKEN_LENGTH_INVALID')
          if any(ch in token for ch in ('\r', '\n', '\x00')):
              raise SystemExit('STAGE35_PARITY_ATTESTATION_SECRET_GATE=FAIL\nCODE=DISPATCH_TOKEN_MULTILINE_OR_NUL')
          print('STAGE35_PARITY_ATTESTATION_SECRET_GATE=PASS')
          print('SECRET_VALUE_PRINTED=false')
          print('SECRET_DIGEST_PRINTED=false')
          PY

      - name: Prove auth parity with forbidden body before claim/provider path
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          endpoint = 'https://mceukeondizkwlpfxzgf.supabase.co/functions/v1/student-access-alert-dispatcher'
          body = json.dumps({'parity_probe': True}, separators=(',', ':')).encode('utf-8')
          request = urllib.request.Request(
              endpoint,
              data=body,
              method='POST',
              headers={
                  'content-type': 'application/json',
                  'accept': 'application/json',
                  'x-fitnexus-alert-dispatch-token': os.environ['DISPATCH_TOKEN'],
                  'user-agent': 'FitNexus-Stage35-Dispatch-Secret-Parity-Attestation/1.0',
              },
          )
          try:
              with urllib.request.urlopen(request, timeout=30) as response:
                  status = response.status
                  raw = response.read(4096)
          except urllib.error.HTTPError as exc:
              status = exc.code
              raw = exc.read(4096)
          except urllib.error.URLError as exc:
              raise SystemExit('STAGE35_DISPATCH_SECRET_PARITY_ATTESTATION=FAIL\nTRANSPORT=' + type(exc.reason).__name__)
          try:
              value = json.loads(raw.decode('utf-8'))
          except Exception:
              value = {}
          if status != 400 or not isinstance(value, dict) or value.get('error') != 'ALERT_DISPATCH_BODY_FIELD_FORBIDDEN':
              raise SystemExit(
                  'STAGE35_DISPATCH_SECRET_PARITY_ATTESTATION=FAIL\n'
                  f'HTTP_STATUS={status}\nERROR={value.get("error") if isinstance(value, dict) else None}'
              )
          print('STAGE35_DISPATCH_SECRET_PARITY_ATTESTATION=PASS')
          print('HTTP_STATUS=400')
          print('ERROR=ALERT_DISPATCH_BODY_FIELD_FORBIDDEN')
          print('CUSTOM_AUTH_GATE_PASSED=true')
          print('BODY_REJECTED_BEFORE_RUNTIME_PROVIDER_CONFIG=true')
          print('DATABASE_CLAIM_CALLED=false')
          print('DELIVERY_RECEIPT_WRITTEN=false')
          print('TELEGRAM_PROVIDER_CALLED=false')
          print('SECRET_VALUE_PRINTED=false')
          print('SECRET_DIGEST_PRINTED=false')
          PY
