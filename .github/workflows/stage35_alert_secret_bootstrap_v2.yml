name: Stage 35 Alert Secret Bootstrap V2

on:
  pull_request:
    branches:
      - main
    paths:
      - '04_backend_supabase/tools/Invoke-Stage35AlertSecretBootstrapV2.ps1'
      - '04_backend_supabase/stage35_alert_secret_bootstrap_observation_fix_authority.json'
      - '.github/workflows/stage35_alert_secret_bootstrap_v2.yml'

permissions:
  contents: read

jobs:
  verify-v2:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Parse V2 PowerShell without executing it
        shell: pwsh
        run: |
          $path = '04_backend_supabase/tools/Invoke-Stage35AlertSecretBootstrapV2.ps1'
          [void][scriptblock]::Create((Get-Content -LiteralPath $path -Raw))
          Write-Host 'STAGE35_ALERT_SECRET_BOOTSTRAP_V2_PARSE=PASS'

      - name: Validate fail-closed V2 invariants
        shell: pwsh
        run: |
          $path = '04_backend_supabase/tools/Invoke-Stage35AlertSecretBootstrapV2.ps1'
          $source = Get-Content -LiteralPath $path -Raw
          $required = @(
            'https://api.supabase.com/v1/projects/$ProjectRef/secrets',
            'STUDENT_ACCESS_ALERT_DISPATCH_TOKEN',
            'STUDENT_ACCESS_ALERT_TELEGRAM_BOT_TOKEN',
            'STUDENT_ACCESS_ALERT_TELEGRAM_CHAT_ID',
            'secret set $Name --repo $Repository',
            'DATABASE_MIGRATION_APPLIED=false',
            'EDGE_FUNCTION_DEPLOYED=false',
            'TELEGRAM_PROVIDER_CALLED=false',
            'ONE_SHOT_EXTERNAL_DELIVERY_PROOF_CONSUMED=false'
          )
          foreach ($fragment in $required) {
            if (-not $source.Contains($fragment)) { throw "Missing invariant: $fragment" }
          }
          if ($source.Contains('https://api.telegram.org')) { throw 'Provider call forbidden in bootstrap V2' }
          if ($source.Contains('functions deploy')) { throw 'Edge deployment forbidden in bootstrap V2' }
          if ($source.Contains('db push')) { throw 'Database deployment forbidden in bootstrap V2' }
          Write-Host 'STAGE35_ALERT_SECRET_BOOTSTRAP_V2_STATIC_GUARD=PASS'

      - name: Validate authority JSON
        shell: pwsh
        run: |
          $authority = Get-Content '04_backend_supabase/stage35_alert_secret_bootstrap_observation_fix_authority.json' -Raw | ConvertFrom-Json
          if ($authority.failure_class -ne 'BGF-STAGE35-ALERT-SECRET-BOOTSTRAP-OBSERVATION-298') { throw 'Failure class drift' }
          if ($authority.observed_failure.github_secret_write_reached -ne $false) { throw 'Observed boundary drift' }
          if ($authority.prevention.runtime_secret_verification_transport -ne 'supabase_management_api_get_project_secrets_names_only') { throw 'Verification transport drift' }
          if ($authority.gates.external_delivery_proof -ne $false) { throw 'Proof gate must remain closed' }
          Write-Host 'STAGE35_ALERT_SECRET_BOOTSTRAP_V2_AUTHORITY=PASS'
