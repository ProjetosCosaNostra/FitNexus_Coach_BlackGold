name: Android Play Store Screenshot 02 Capture V1

on:
  pull_request:
    paths:
      - '03_app_flutter/fitnexus_app/android/play_store/PLAY_STORE_SCREENSHOT_02_CAPTURE_V1.json'
      - '03_app_flutter/fitnexus_app/lib/store_capture_main.dart'
      - '03_app_flutter/fitnexus_app/lib/features/professor/professor_data_repository.dart'
      - '03_app_flutter/fitnexus_app/tool/FITNEXUS_PLAY_STORE_SCREENSHOT_02_CAPTURE_V1.ps1'
      - '.github/workflows/android_play_store_screenshot_02_capture_v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate screenshot 02 contract
        shell: python
        run: |
          import json
          from pathlib import Path

          path = Path('03_app_flutter/fitnexus_app/android/play_store/PLAY_STORE_SCREENSHOT_02_CAPTURE_V1.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          assert data['application_id'] == 'br.com.lafamigliaplayworks.fitnexuscoach'
          assert data['capture']['target_width_px'] == 1080
          assert data['capture']['target_height_px'] == 1920
          assert data['capture']['synthetic_data'] is True
          assert data['capture']['real_user_data'] is False
          assert data['capture']['production_ui_widget'] == 'StudentAccessManagementPage'
          assert data['capture']['dart_define_shot'] == '02'
          for key, value in data['hard_boundaries'].items():
              assert value is False, f'{key} must remain false'
          print('FITNEXUS_PLAY_SCREENSHOT_02_CONTRACT=PASS')

      - name: Validate runner without Android binding
        shell: pwsh
        run: |
          ./03_app_flutter/fitnexus_app/tool/FITNEXUS_PLAY_STORE_SCREENSHOT_02_CAPTURE_V1.ps1 -ValidateOnly

      - name: Guard capture isolation and PS5.1 compatibility
        shell: python
        run: |
          import re
          from pathlib import Path

          entry = Path('03_app_flutter/fitnexus_app/lib/store_capture_main.dart').read_text(encoding='utf-8')
          repo = Path('03_app_flutter/fitnexus_app/lib/features/professor/professor_data_repository.dart').read_text(encoding='utf-8')
          runner = Path('03_app_flutter/fitnexus_app/tool/FITNEXUS_PLAY_STORE_SCREENSHOT_02_CAPTURE_V1.ps1').read_text(encoding='utf-8')

          assert 'FITNEXUS_STORE_CAPTURE_SHOT' in entry
          assert "fitNexusStoreCaptureShot == '02'" in entry
          assert 'StudentAccessManagementPage' in entry
          assert 'Supabase.initialize' not in entry

          assert 'fitNexusStoreCaptureDataMode' in repo
          assert "bool.fromEnvironment(" in repo
          assert "'FITNEXUS_STORE_CAPTURE'" in repo
          assert 'STORE_CAPTURE_REMOTE_MUTATION_FORBIDDEN' in repo
          assert 'store-student-01' in repo

          assert '--dart-define=FITNEXUS_STORE_CAPTURE=true' in runner
          assert '--dart-define=FITNEXUS_STORE_CAPTURE_SHOT=02' in runner
          assert 'FAILSAFE_RESTORE_PRODUCTION_APK' in runner
          assert 'Assert-CanonicalReleaseInstalled' in runner
          assert 'PRODUCTION_RELEASE_RESTORED=' in runner
          assert 'SUPABASE_MUTATION_PERFORMED=false' in runner
          assert 'PLAY_CONSOLE_MUTATION_PERFORMED=false' in runner
          assert '[int]($Bytes[$Offset])' in runner
          assert '[int]($Bytes[$Offset + 1])' in runner
          assert '[int]($Bytes[$Offset + 2])' in runner
          assert '[int]($Bytes[$Offset + 3])' in runner

          forbidden = ['.ArgumentList', 'ForEach-Object -Parallel', '??', '?.']
          hits = [token for token in forbidden if token in runner]
          assert not hits, f'PowerShell 5.1 incompatible token(s): {hits}'
          inline_if_value = re.compile(r'=\s*\(\s*if\s*\(', re.IGNORECASE)
          assert not inline_if_value.search(runner)

          print('FITNEXUS_PLAY_SCREENSHOT_02_ISOLATION_GUARD=PASS')
          print('FITNEXUS_PLAY_SCREENSHOT_02_PS51_GUARD=PASS')
          print('FITNEXUS_PLAY_SCREENSHOT_02_FAILSAFE_RESTORE_GUARD=PASS')
