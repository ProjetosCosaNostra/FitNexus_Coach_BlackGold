name: Stage 35 Alert Secret Bootstrap Tooling

on:
  pull_request:
    branches:
      - main
    paths:
      - '04_backend_supabase/stage35_alert_secret_bootstrap_tooling_authority.json'
      - '04_backend_supabase/stage35_alert_controlled_fixture_promotion_and_secret_readiness_authority.json'
      - '04_backend_supabase/tools/Invoke-Stage35AlertSecretBootstrap.ps1'
      - '04_backend_supabase/tools/verify_stage35_alert_secret_bootstrap_tooling.py'
      - '.github/workflows/stage35_alert_secret_bootstrap_tooling.yml'
  push:
    branches:
      - 'blackgold/**'
      - main
    paths:
      - '04_backend_supabase/stage35_alert_secret_bootstrap_tooling_authority.json'
      - '04_backend_supabase/stage35_alert_controlled_fixture_promotion_and_secret_readiness_authority.json'
      - '04_backend_supabase/tools/Invoke-Stage35AlertSecretBootstrap.ps1'
      - '04_backend_supabase/tools/verify_stage35_alert_secret_bootstrap_tooling.py'
      - '.github/workflows/stage35_alert_secret_bootstrap_tooling.yml'

permissions:
  contents: read

jobs:
  verify-secret-bootstrap-tooling:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Stage 35 secret bootstrap repository guard
        run: python 04_backend_supabase/tools/verify_stage35_alert_secret_bootstrap_tooling.py

      - name: Parse PowerShell bootstrap without executing secrets or remote calls
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            '04_backend_supabase/tools/Invoke-Stage35AlertSecretBootstrap.ps1',
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }
          Write-Host 'STAGE35_ALERT_SECRET_BOOTSTRAP_POWERSHELL_PARSE=PASS'
          Write-Host 'BOOTSTRAP_SCRIPT_EXECUTED=false'
          Write-Host 'SECRET_VALUES_ACCESSED=false'
          Write-Host 'REMOTE_MUTATION=false'
