name: Stage73 Cross-Gate Decision Frontier

on:
  pull_request:
    paths:
      - '04_backend_supabase/stage73_cross_gate_decision_frontier_authority.json'
      - '04_backend_supabase/tools/build_stage73_cross_gate_decision_frontier.py'
      - '04_backend_supabase/tools/verify_stage73_cross_gate_decision_frontier.py'
      - '.github/workflows/stage73_cross_gate_decision_frontier.yml'
      - '10_compliance/drafts/COMPLIANCE_OPEN_DECISIONS.json'
      - '10_compliance/drafts/PRIVACY_NOTICE_CANDIDATE_PTBR.md'
      - '10_compliance/drafts/TERMS_OF_USE_CANDIDATE_PTBR.md'
      - '10_compliance/drafts/PROCESSING_ROLE_MATRIX_CANDIDATE.md'
      - '10_compliance/drafts/DATA_SUBJECT_REQUEST_RUNBOOK_CANDIDATE.md'
      - '10_compliance/drafts/INCIDENT_RESPONSE_RUNBOOK_CANDIDATE.md'
  push:
    branches:
      - main
      - 'blackgold/**'
    paths:
      - '04_backend_supabase/stage73_cross_gate_decision_frontier_authority.json'
      - '04_backend_supabase/tools/build_stage73_cross_gate_decision_frontier.py'
      - '04_backend_supabase/tools/verify_stage73_cross_gate_decision_frontier.py'
      - '.github/workflows/stage73_cross_gate_decision_frontier.yml'
      - '10_compliance/drafts/COMPLIANCE_OPEN_DECISIONS.json'
      - '10_compliance/drafts/PRIVACY_NOTICE_CANDIDATE_PTBR.md'
      - '10_compliance/drafts/TERMS_OF_USE_CANDIDATE_PTBR.md'
      - '10_compliance/drafts/PROCESSING_ROLE_MATRIX_CANDIDATE.md'
      - '10_compliance/drafts/DATA_SUBJECT_REQUEST_RUNBOOK_CANDIDATE.md'
      - '10_compliance/drafts/INCIDENT_RESPONSE_RUNBOOK_CANDIDATE.md'

permissions:
  contents: read

jobs:
  build-non-attesting-frontier:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify Stage73 frontier contract
        run: python 04_backend_supabase/tools/verify_stage73_cross_gate_decision_frontier.py

      - name: Build deterministic frontier twice
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/stage73"
          python 04_backend_supabase/tools/build_stage73_cross_gate_decision_frontier.py \
            --source-sha "${{ github.event.pull_request.head.sha || github.sha }}" \
            --output "$RUNNER_TEMP/stage73/frontier_a.json"
          python 04_backend_supabase/tools/build_stage73_cross_gate_decision_frontier.py \
            --source-sha "${{ github.event.pull_request.head.sha || github.sha }}" \
            --output "$RUNNER_TEMP/stage73/frontier_b.json"
          cmp "$RUNNER_TEMP/stage73/frontier_a.json" "$RUNNER_TEMP/stage73/frontier_b.json"

      - name: Upload non-attesting decision frontier
        uses: actions/upload-artifact@v4
        with:
          name: stage73-cross-gate-decision-frontier-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/stage73/frontier_a.json
          retention-days: 7

      - name: Preserve non-attesting boundary
        run: |
          echo "FANOUT_IS_BUSINESS_PRIORITY=false"
          echo "FANOUT_IS_LEGAL_PRIORITY=false"
          echo "REVIEW_PACKET_IS_EVIDENCE=false"
          echo "EVIDENCE_MIGRATION=false"
          echo "GATE_PROMOTION=false"
          echo "CONTROLLED_LAUNCH=DENIED"
          echo "PAID_MEDIA=DENIED"
          echo "REMOTE_MUTATION=false"
