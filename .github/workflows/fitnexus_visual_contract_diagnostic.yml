name: FitNexus Visual Contract Diagnostic

on:
  push:
    branches:
      - blackgold/mobile-home-premium-redesign-v1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  visual-tests:
    name: visual-${{ matrix.test_name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - test_name: contract
            test_file: test/blackgold_visual_contract_test.dart
          - test_name: premium
            test_file: test/premium_landing_page_test.dart
    defaults:
      run:
        working-directory: 03_app_flutter/fitnexus_app
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Run isolated visual test and preserve diagnostics
        id: visual_test
        shell: bash
        run: |
          mkdir -p diagnostic_logs
          set +e
          flutter test --no-pub -r expanded "${{ matrix.test_file }}" 2>&1 | tee "diagnostic_logs/${{ matrix.test_name }}.log"
          code=${PIPESTATUS[0]}
          {
            echo '### FitNexus visual test: ${{ matrix.test_name }}'
            echo '```text'
            tail -n 180 "diagnostic_logs/${{ matrix.test_name }}.log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$code"

      - name: Upload diagnostic log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fitnexus-visual-diagnostic-${{ matrix.test_name }}
          path: 03_app_flutter/fitnexus_app/diagnostic_logs/${{ matrix.test_name }}.log
          if-no-files-found: error
          retention-days: 3
