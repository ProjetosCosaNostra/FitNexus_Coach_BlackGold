name: Stage80 Sensitive Data Minimization Inventory

on:
  pull_request:
    branches:
      - main
    paths:
      - "04_backend_supabase/stage80_sensitive_data_minimization_inventory_authority.json"
      - "04_backend_supabase/tools/build_stage80_sensitive_data_minimization_inventory.py"
      - "04_backend_supabase/tools/verify_stage80_sensitive_data_minimization_inventory.py"
      - "10_compliance/inventory/STAGE80_TECHNICAL_SENSITIVE_DATA_MINIMIZATION_REGISTRY.json"
      - "10_compliance/drafts/COMPLIANCE_OPEN_DECISIONS.json"
      - "10_compliance/drafts/PROCESSING_ROLE_MATRIX_CANDIDATE.md"
      - "10_compliance/drafts/PRIVACY_NOTICE_CANDIDATE_PTBR.md"
      - "10_compliance/drafts/INCIDENT_RESPONSE_RUNBOOK_CANDIDATE.md"
      - "04_backend_supabase/migrations/**"
      - ".github/workflows/stage80_sensitive_data_minimization_inventory.yml"

permissions:
  contents: read

jobs:
  build-non-attesting-sensitive-data-inventory:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Verify Stage80 sensitive data minimization contract
        run: python 04_backend_supabase/tools/verify_stage80_sensitive_data_minimization_inventory.py

      - name: Build deterministic sensitive data minimization inventory twice
        shell: bash
        run: |
          set -euo pipefail
          python 04_backend_supabase/tools/build_stage80_sensitive_data_minimization_inventory.py \
            --source-sha "${{ github.event.pull_request.head.sha }}" \
            --output /tmp/stage80_sensitive_a.json
          python 04_backend_supabase/tools/build_stage80_sensitive_data_minimization_inventory.py \
            --source-sha "${{ github.event.pull_request.head.sha }}" \
            --output /tmp/stage80_sensitive_b.json
          cmp /tmp/stage80_sensitive_a.json /tmp/stage80_sensitive_b.json
          grep -F '"potentially_sensitive_source_flags_are_final_legal_classification": false' /tmp/stage80_sensitive_a.json >/dev/null
          grep -F '"external_ai_sensitive_data_use_authorized": false' /tmp/stage80_sensitive_a.json >/dev/null
          grep -F '"marketing_sensitive_data_use_authorized": false' /tmp/stage80_sensitive_a.json >/dev/null
          grep -F '"target_open_decision_closed": false' /tmp/stage80_sensitive_a.json >/dev/null

      - name: Upload non-attesting sensitive data inventory
        uses: actions/upload-artifact@v4
        with:
          name: stage80-sensitive-data-minimization-inventory-${{ github.event.pull_request.head.sha }}
          retention-days: 7
          if-no-files-found: error
          path: |
            /tmp/stage80_sensitive_a.json
            04_backend_supabase/stage80_sensitive_data_minimization_inventory_authority.json
            10_compliance/inventory/STAGE80_TECHNICAL_SENSITIVE_DATA_MINIMIZATION_REGISTRY.json

      - name: Preserve sensitive data legal review boundary
        run: |
          echo "FINAL_LEGAL_CLASSIFICATION_APPROVED=false"
          echo "SENSITIVE_DATA_POLICY_APPROVED=false"
          echo "TARGET_DECISION_CLOSED=false"
          echo "GATE_PROMOTION=false"
          echo "CONTROLLED_LAUNCH=DENIED"
          echo "REMOTE_MUTATION=false"
