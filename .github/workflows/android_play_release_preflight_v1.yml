name: Android Play Release Preflight V1

on:
  pull_request:
    branches: [main]
    paths:
      - '02_produto/PRODUCT_REVENUE_RELEASE_TRAIN_V1.json'
      - '03_app_flutter/fitnexus_app/**'
      - '.github/workflows/android_play_release_preflight_v1.yml'
      - '.gitignore'
  push:
    branches:
      - 'blackgold/**'
    paths:
      - '02_produto/PRODUCT_REVENUE_RELEASE_TRAIN_V1.json'
      - '03_app_flutter/fitnexus_app/**'
      - '.github/workflows/android_play_release_preflight_v1.yml'
      - '.gitignore'

permissions:
  contents: read

jobs:
  android-release-preflight:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 03_app_flutter/fitnexus_app

    steps:
      - name: Checkout exact source
        uses: actions/checkout@v6

      - name: Set up Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Inventory Play publication blockers
        run: python tool/verify_play_release_preflight.py --mode inventory

      - name: Regress one-command signed AAB runner
        shell: pwsh
        run: |
          $source = Get-Content -LiteralPath 'tool/FITNEXUS_PLAY_SIGNED_AAB_RUNNER_V1.ps1' -Raw
          $null = [scriptblock]::Create($source)
          if ($source -match '--error-unmatch') {
            throw 'FNX-PS51-GIT-LS-FILES-EXPECTED-MISS-NATIVECOMMANDERROR-144 regression: forbidden --error-unmatch token returned.'
          }
          if ($source -notmatch '\$trackedEntries\s*=\s*@\(& git ls-files -- \$GitPath\)') {
            throw 'PS5.1-safe non-erroring git ls-files membership check is missing.'
          }
          & ./tool/FITNEXUS_PLAY_SIGNED_AAB_RUNNER_V1.ps1 -ValidateOnly
          if ($LASTEXITCODE -ne 0) {
            throw "FITNEXUS_SIGNED_AAB_RUNNER_VALIDATE_ONLY_FAILED_EXIT_$LASTEXITCODE"
          }
          Write-Output 'FITNEXUS_SIGNED_AAB_RUNNER_PARSE=PASS'
          Write-Output 'FITNEXUS_SIGNED_AAB_RUNNER_VALIDATE_ONLY=PASS'
          Write-Output 'PS51_EXPECTED_NEGATIVE_NATIVE_STDERR_REGRESSION=PASS'
          Write-Output 'SIGNED_AAB_EXECUTION_PERFORMED=false'

      - name: Assert signing secrets are absent from CI checkout
        run: |
          set -euo pipefail
          test ! -f android/key.properties
          if find android -type f \( -name '*.jks' -o -name '*.keystore' \) -print -quit | grep -q .; then
            echo 'PLAY_SIGNING_SECRET_HYGIENE=FAIL'
            exit 1
          fi
          echo 'PLAY_SIGNING_SECRET_HYGIENE=PASS'
          echo 'PLAY_CI_SIGNING_MODE=UNSIGNED_RELEASE_PREVIEW'

      - name: Static analysis
        run: flutter analyze

      - name: Widget and unit tests
        run: flutter test

      - name: Compile Android App Bundle release preview
        run: flutter build appbundle --release

      - name: Record non-publishable AAB compile receipt
        run: |
          set -euo pipefail
          AAB='build/app/outputs/bundle/release/app-release.aab'
          test -f "$AAB"
          echo "ANDROID_AAB_COMPILE=PASS"
          echo "ANDROID_AAB_BYTES=$(stat -c%s "$AAB")"
          echo "ANDROID_AAB_SHA256=$(sha256sum "$AAB" | awk '{print $1}')"
          echo "ANDROID_AAB_SIGNING_AUTHORITY=EXTERNAL_UPLOAD_KEY_NOT_PRESENT_IN_CI"
          echo "ANDROID_AAB_PUBLICATION_AUTHORIZED=false"
          echo "ANDROID_AAB_REASON=signed_aab_play_app_signing_play_console_uniqueness_and_public_upload_authority_are_separately_gated"

      - name: Preserve Play publication boundary
        run: |
          echo "PLAY_UPLOAD_PERFORMED=false"
          echo "PLAY_PUBLICATION_PERFORMED=false"
          echo "LIVE_BILLING_ENABLED=false"
          echo "PAID_MEDIA_ENABLED=false"
