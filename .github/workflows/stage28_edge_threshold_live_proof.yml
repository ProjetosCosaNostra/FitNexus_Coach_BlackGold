name: Stage 28 Edge Threshold Live Proof

on:
  pull_request:
    types: [opened]
    paths:
      - '04_backend_supabase/tools/verify_student_access_edge_threshold_live_stage28.py'
      - '.github/workflows/stage28_edge_threshold_live_proof.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  threshold-proof:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Prove exact network-origin threshold at Edge
        run: python 04_backend_supabase/tools/verify_student_access_edge_threshold_live_stage28.py
