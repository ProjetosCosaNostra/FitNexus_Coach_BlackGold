name: Stage 35 Alert Secret Bootstrap V4

on:
  pull_request:
    branches:
      - main
    paths:
      - '04_backend_supabase/tools/Invoke-Stage35AlertSecretBootstrapV4.ps1'
      - '04_backend_supabase/stage35_alert_secret_bootstrap_v4_array_shape_authority.json'
      - '.github/workflows/stage35_alert_secret_bootstrap_v4.yml'

permissions:
  contents: read

jobs:
  verify-v4:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Parse V4 PowerShell without executing it
        shell: pwsh
        run: |
          $path = '04_backend_supabase/tools/Invoke-Stage35AlertSecretBootstrapV4.ps1'
          [void][scriptblock]::Create((Get-Content -LiteralPath $path -Raw))
          Write-Host 'STAGE35_ALERT_SECRET_BOOTSTRAP_V4_PARSE=PASS'

      - name: Validate exact bulk JSON array construction
        shell: pwsh
        run: |
          $path = '04_backend_supabase/tools/Invoke-Stage35AlertSecretBootstrapV4.ps1'
          $source = Get-Content -LiteralPath $path -Raw
          $required = @(
            "BGF-STAGE35-ALERT-SECRET-BULK-JSON-ARRAY-PIPELINE-300",
            'ConvertTo-Json -InputObject $secretObjects',
            "SECRET_BODY_NOT_SINGLE_STRING",
            "SECRET_BODY_NOT_JSON_ARRAY_DOCUMENT",
            "SECRET_BODY_ITEM_COUNT_NOT_THREE",
            'Invoke-RestMethod -Method Post -Uri "https://api.supabase.com/v1/projects/$ProjectRef/secrets"',
            'Invoke-RestMethod -Method Get -Uri "https://api.supabase.com/v1/projects/$ProjectRef/secrets"',
            'GITHUB_ACTIONS_SECRET_NAMES_VERIFIED=4/4',
            'SUPABASE_EDGE_RUNTIME_SECRET_NAMES_VERIFIED=3/3',
            'DATABASE_MIGRATION_APPLIED=false',
            'EDGE_FUNCTION_DEPLOYED=false',
            'TELEGRAM_PROVIDER_CALLED=false',
            'ONE_SHOT_EXTERNAL_DELIVERY_PROOF_CONSUMED=false'
          )
          foreach ($fragment in $required) {
            if (-not $source.Contains($fragment)) { throw "Missing V4 invariant: $fragment" }
          }
          if ($source -match '\)\s*\|\s*ConvertTo-Json') {
            throw 'Pipeline-based serialization is forbidden for the bulk secret body'
          }
          if ($source.Contains('https://api.telegram.org')) { throw 'Telegram provider call forbidden in bootstrap V4' }
          if ($source.Contains('functions deploy')) { throw 'Edge deployment forbidden in bootstrap V4' }
          if ($source.Contains('db push')) { throw 'Database deployment forbidden in bootstrap V4' }
          Write-Host 'STAGE35_ALERT_SECRET_BOOTSTRAP_V4_STATIC_GUARD=PASS'

      - name: Validate V4 authority
        shell: pwsh
        run: |
          $a = Get-Content '04_backend_supabase/stage35_alert_secret_bootstrap_v4_array_shape_authority.json' -Raw | ConvertFrom-Json
          if ($a.failure_class -ne 'BGF-STAGE35-ALERT-SECRET-BULK-JSON-ARRAY-PIPELINE-300') { throw 'Failure class drift' }
          if ($a.prevention.pipeline_serialization_for_bulk_secret_body_forbidden -ne $true) { throw 'Pipeline prevention missing' }
          if ($a.prevention.secret_body_item_count -ne 3) { throw 'Secret body count drift' }
          if ($a.gates.external_delivery_proof -ne $false) { throw 'Proof gate must remain closed' }
          if ($a.observed_failure.github_secret_write_reached -ne $false) { throw 'Observed write boundary drift' }
          Write-Host 'STAGE35_ALERT_SECRET_BOOTSTRAP_V4_AUTHORITY=PASS'
