# Reassessment trigger after Stage35 secret bootstrap V5. No secret values are stored here.
name: Stage 35 Alert Runtime Secret Readiness

on:
  push:
    branches:
      - blackgold/stage35-controlled-fixture-promotion-secret-readiness
    paths:
      - '04_backend_supabase/stage35_alert_controlled_fixture_promotion_and_secret_readiness_authority.json'
      - '04_backend_supabase/tools/verify_stage35_alert_runtime_secret_readiness_preparation.py'
      - '.github/workflows/stage35_alert_runtime_secret_readiness.yml'
  pull_request:
    branches:
      - main
    paths:
      - '04_backend_supabase/stage35_alert_controlled_fixture_promotion_and_secret_readiness_authority.json'
      - '04_backend_supabase/tools/verify_stage35_alert_runtime_secret_readiness_preparation.py'
      - '.github/workflows/stage35_alert_runtime_secret_readiness.yml'

permissions:
  contents: read

jobs:
  assess-secret-presence:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Stage 35 repository readiness guard
        run: python 04_backend_supabase/tools/verify_stage35_alert_runtime_secret_readiness_preparation.py

      - name: Assess required GitHub secret presence without values
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN_VALUE: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          DISPATCH_TOKEN_VALUE: ${{ secrets.STUDENT_ACCESS_ALERT_DISPATCH_TOKEN }}
          TELEGRAM_BOT_TOKEN_VALUE: ${{ secrets.STUDENT_ACCESS_ALERT_TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID_VALUE: ${{ secrets.STUDENT_ACCESS_ALERT_TELEGRAM_CHAT_ID }}
        run: |
          set -euo pipefail
          present() {
            if [[ -n "${1:-}" ]]; then printf 'PRESENT'; else printf 'MISSING'; fi
          }

          SUPABASE_STATUS="$(present "${SUPABASE_ACCESS_TOKEN_VALUE:-}")"
          DISPATCH_STATUS="$(present "${DISPATCH_TOKEN_VALUE:-}")"
          BOT_STATUS="$(present "${TELEGRAM_BOT_TOKEN_VALUE:-}")"
          CHAT_STATUS="$(present "${TELEGRAM_CHAT_ID_VALUE:-}")"

          echo "STAGE35_ALERT_RUNTIME_SECRET_READINESS=OBSERVED"
          echo "SUPABASE_ACCESS_TOKEN=${SUPABASE_STATUS}"
          echo "STUDENT_ACCESS_ALERT_DISPATCH_TOKEN=${DISPATCH_STATUS}"
          echo "STUDENT_ACCESS_ALERT_TELEGRAM_BOT_TOKEN=${BOT_STATUS}"
          echo "STUDENT_ACCESS_ALERT_TELEGRAM_CHAT_ID=${CHAT_STATUS}"

          if [[ "$SUPABASE_STATUS" == PRESENT && "$DISPATCH_STATUS" == PRESENT && "$BOT_STATUS" == PRESENT && "$CHAT_STATUS" == PRESENT ]]; then
            echo "ALL_REQUIRED_GITHUB_SECRETS_PRESENT=true"
          else
            echo "ALL_REQUIRED_GITHUB_SECRETS_PRESENT=false"
          fi

          echo "SECRET_VALUES_PRINTED=false"
          echo "SUPABASE_EDGE_RUNTIME_CONFIGURATION_PROVEN=false"
          echo "REMOTE_MUTATION_PERFORMED=false"
          echo "PROVIDER_CALLED=false"
          echo "LAUNCH_GATE_PROMOTION=DENIED"
