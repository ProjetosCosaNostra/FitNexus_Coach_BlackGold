name: Stage 30 Runtime Rollback Proof

on:
  pull_request:
    types: [opened]
    paths:
      - '03_app_flutter/fitnexus_app/lib/features/student/student_access_transport_contract.dart'
      - '03_app_flutter/fitnexus_app/test/student_access_runtime_rollback_proof_test.dart'
      - '04_backend_supabase/student_access_runtime_rollback_authority.json'
      - '04_backend_supabase/student_access_client_runtime_smoke_authority.json'
      - '04_backend_supabase/student_access_client_cutover_authority.json'
      - '04_backend_supabase/migration_ledger_authority.json'
      - '04_backend_supabase/tools/verify_student_access_runtime_rollback_candidate.py'
      - '.github/workflows/stage30_runtime_rollback_proof.yml'

permissions:
  contents: read

jobs:
  runtime-rollback-proof:
    if: github.event.pull_request.number == 57 && github.event.pull_request.head.ref == 'blackgold/stage30-runtime-rollback-proof'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Runtime rollback candidate guard
        run: python 04_backend_supabase/tools/verify_student_access_runtime_rollback_candidate.py

      - name: Set up Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve dependencies
        working-directory: 03_app_flutter/fitnexus_app
        run: flutter pub get

      - name: Execute focused runtime rollback proof once
        working-directory: 03_app_flutter/fitnexus_app
        run: flutter test test/student_access_runtime_rollback_proof_test.dart --reporter expanded

      - name: Proof boundary receipt
        run: |
          echo 'STAGE30_RUNTIME_ROLLBACK_PROOF_EXECUTION=COMPLETED'
          echo 'PRODUCTION_TRANSPORT_CHANGE=false'
          echo 'NETWORK_CALL_EXECUTED=false'
          echo 'REAL_CUSTOMER_DATA_USED=false'
          echo 'DIRECT_RPC_GRANTS_CHANGED=false'
          echo 'EDGE_SELECTION=false'
          echo 'LAUNCH_GATE_PROMOTION=DENIED'
