name: Flutter Quality Gate

on:
  pull_request:
    paths:
      - '03_app_flutter/fitnexus_app/**'
      - '04_backend_supabase/project_identity.json'
      - '04_backend_supabase/migration_ledger_authority.json'
      - '04_backend_supabase/security_definer_exposure_authority.json'
      - '04_backend_supabase/student_access_abuse_authority.json'
      - '04_backend_supabase/student_access_network_origin_boundary.json'
      - '04_backend_supabase/student_access_network_rate_limit_authority.json'
      - '04_backend_supabase/student_access_edge_gateway_authority.json'
      - '04_backend_supabase/student_access_valid_route_authority.json'
      - '04_backend_supabase/student_access_client_cutover_authority.json'
      - '04_backend_supabase/student_access_client_runtime_smoke_authority.json'
      - '04_backend_supabase/student_access_runtime_rollback_authority.json'
      - '04_backend_supabase/student_access_client_edge_runtime_proof_authority.json'
      - '04_backend_supabase/student_access_production_edge_selection_authority.json'
      - '04_backend_supabase/student_access_stage32_post_cutover_runtime_proof_authority.json'
      - '04_backend_supabase/stage31_live_proof_workflow_seal_authority.json'
      - '04_backend_supabase/stage32_post_cutover_live_proof_workflow_seal_authority.json'
      - '04_backend_supabase/stage32_post_cutover_live_proof_r1_workflow_seal_authority.json'
      - '04_backend_supabase/stage32_post_cutover_live_proof_r1_cleanup_authority.json'
      - '04_backend_supabase/stage32_post_cutover_rollback_proof_authority.json'
      - '04_backend_supabase/stage32_post_cutover_live_proof_failure_r0_authority.json'
      - '04_backend_supabase/cf_origin_spoof_sentinel_authority.json'
      - '04_backend_supabase/external_gate_evidence_placeholders.json'
      - '04_backend_supabase/migrations/**'
      - '04_backend_supabase/operations/**'
      - '04_backend_supabase/functions/**'
      - '04_backend_supabase/tools/**'
      - '.github/workflows/flutter_quality_gate.yml'
      - '.github/workflows/stage31_client_edge_runtime_live_proof.yml'
      - '.github/workflows/stage32_post_cutover_edge_runtime_live_proof.yml'
      - '.github/workflows/stage32_post_cutover_edge_runtime_live_proof_r1.yml'
  push:
    branches:
      - main
      - 'blackgold/**'
    paths:
      - '03_app_flutter/fitnexus_app/**'
      - '04_backend_supabase/project_identity.json'
      - '04_backend_supabase/migration_ledger_authority.json'
      - '04_backend_supabase/security_definer_exposure_authority.json'
      - '04_backend_supabase/student_access_abuse_authority.json'
      - '04_backend_supabase/student_access_network_origin_boundary.json'
      - '04_backend_supabase/student_access_network_rate_limit_authority.json'
      - '04_backend_supabase/student_access_edge_gateway_authority.json'
      - '04_backend_supabase/student_access_valid_route_authority.json'
      - '04_backend_supabase/student_access_client_cutover_authority.json'
      - '04_backend_supabase/student_access_client_runtime_smoke_authority.json'
      - '04_backend_supabase/student_access_runtime_rollback_authority.json'
      - '04_backend_supabase/student_access_client_edge_runtime_proof_authority.json'
      - '04_backend_supabase/student_access_production_edge_selection_authority.json'
      - '04_backend_supabase/student_access_stage32_post_cutover_runtime_proof_authority.json'
      - '04_backend_supabase/stage31_live_proof_workflow_seal_authority.json'
      - '04_backend_supabase/stage32_post_cutover_live_proof_workflow_seal_authority.json'
      - '04_backend_supabase/stage32_post_cutover_live_proof_r1_workflow_seal_authority.json'
      - '04_backend_supabase/stage32_post_cutover_live_proof_r1_cleanup_authority.json'
      - '04_backend_supabase/stage32_post_cutover_rollback_proof_authority.json'
      - '04_backend_supabase/stage32_post_cutover_live_proof_failure_r0_authority.json'
      - '04_backend_supabase/cf_origin_spoof_sentinel_authority.json'
      - '04_backend_supabase/external_gate_evidence_placeholders.json'
      - '04_backend_supabase/migrations/**'
      - '04_backend_supabase/operations/**'
      - '04_backend_supabase/functions/**'
      - '04_backend_supabase/tools/**'
      - '.github/workflows/flutter_quality_gate.yml'
      - '.github/workflows/stage31_client_edge_runtime_live_proof.yml'
      - '.github/workflows/stage32_post_cutover_edge_runtime_live_proof.yml'
      - '.github/workflows/stage32_post_cutover_edge_runtime_live_proof_r1.yml'

permissions:
  contents: read

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 03_app_flutter/fitnexus_app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Supabase project identity guard
        run: python ../../04_backend_supabase/tools/verify_project_identity.py

      - name: Migration ledger contract guard
        run: python ../../04_backend_supabase/tools/verify_migration_ledger_contract.py

      - name: Migration ledger reconciler regression
        run: python ../../04_backend_supabase/tools/test_migration_ledger_reconciler.py

      - name: Decision Intelligence contract guard
        run: python ../../04_backend_supabase/tools/verify_decision_intelligence_contract.py

      - name: Coach Action Center contract guard
        run: python ../../04_backend_supabase/tools/verify_coach_action_center_contract.py

      - name: Subscription entitlement contract guard
        run: python ../../04_backend_supabase/tools/verify_subscription_entitlements_contract.py

      - name: Billing provider contract guard
        run: python ../../04_backend_supabase/tools/verify_billing_provider_contract.py

      - name: Pricing authority contract guard
        run: python ../../04_backend_supabase/tools/verify_pricing_authority_contract.py

      - name: Growth instrumentation contract guard
        run: python ../../04_backend_supabase/tools/verify_growth_instrumentation_contract.py

      - name: Public funnel capture contract guard
        run: python ../../04_backend_supabase/tools/verify_public_funnel_capture_contract.py

      - name: Controlled launch admission contract guard
        run: python ../../04_backend_supabase/tools/verify_controlled_launch_admission_contract.py

      - name: External gate evidence placeholder guard
        run: python ../../04_backend_supabase/tools/verify_external_gate_evidence_placeholders.py

      - name: Web release contract guard
        run: python ../../04_backend_supabase/tools/verify_web_release_contract.py

      - name: Student access security contract guard
        run: python ../../04_backend_supabase/tools/verify_student_access_security_contract.py

      - name: Student access issuance authority guard
        run: python ../../04_backend_supabase/tools/verify_student_access_issuance_authority.py

      - name: SECURITY DEFINER exposure authority guard
        run: python ../../04_backend_supabase/tools/verify_security_definer_exposure_authority.py

      - name: Student access abuse observability guard
        run: python ../../04_backend_supabase/tools/verify_student_access_abuse_observability.py

      - name: Student network-origin cutover guard
        run: python ../../04_backend_supabase/tools/verify_student_access_network_origin_boundary.py

      - name: Student network-origin rate-limit guard
        run: python ../../04_backend_supabase/tools/verify_stage32_rollback_fixture_historical_compat.py rate_limit

      - name: Student Edge gateway candidate guard
        run: python ../../04_backend_supabase/tools/verify_student_access_edge_gateway_candidate.py

      - name: Student valid-route synthetic fixture guard
        run: python ../../04_backend_supabase/tools/verify_stage32_rollback_fixture_historical_compat.py valid_route

      - name: Stage 31 live proof cleanup reconciliation guard
        run: python ../../04_backend_supabase/tools/verify_stage32_rollback_fixture_historical_compat.py stage31

      - name: Stage 31 live proof workflow seal guard
        run: python ../../04_backend_supabase/tools/verify_stage31_live_proof_workflow_seal.py

      - name: Stage 32 production Edge selection preparation guard
        run: python ../../04_backend_supabase/tools/verify_student_access_production_edge_selection_preparation.py

      - name: Stage 32 historical post-cutover preparation guard
        run: python ../../04_backend_supabase/tools/verify_stage32_rollback_fixture_historical_compat.py current_rearm

      - name: Stage 32 historical R0 workflow seal guard
        run: python ../../04_backend_supabase/tools/verify_stage32_rollback_fixture_historical_compat.py r0_seal

      - name: Stage 32 historical pre-network recovery guard
        run: python ../../04_backend_supabase/tools/verify_stage32_rollback_fixture_historical_compat.py r1_recovery

      - name: Stage 32 post-cutover live proof R1 workflow seal guard
        run: python ../../04_backend_supabase/tools/verify_stage32_post_cutover_live_proof_r1_workflow_seal.py

      - name: Stage 32 R1 proof cleanup reconciliation guard
        run: python ../../04_backend_supabase/tools/verify_stage32_rollback_fixture_historical_compat.py cleanup

      - name: Stage 32 post-cutover rollback proof preparation guard
        run: python ../../04_backend_supabase/tools/verify_stage32_post_cutover_rollback_proof_preparation.py

      - name: Student client Edge runtime smoke lifecycle guard
        run: python ../../04_backend_supabase/tools/verify_stage32_rollback_fixture_historical_compat.py smoke

      - name: Student runtime rollback proof lifecycle guard
        run: python ../../04_backend_supabase/tools/verify_stage32_rollback_fixture_historical_compat.py rollback

      - name: CF origin spoof sentinel source guard
        run: python ../../04_backend_supabase/tools/verify_cf_origin_spoof_sentinel_source.py

      - name: Tenant isolation adversarial guard
        run: python ../../04_backend_supabase/tools/verify_tenant_isolation_contract.py

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Edge function typecheck
        run: deno check ../../04_backend_supabase/functions/student-access-gateway/index.ts

      - name: Live Edge origin probe
        run: python ../../04_backend_supabase/tools/verify_student_access_edge_probe_live.py

      - name: Live CF origin spoof sentinel
        run: python ../../04_backend_supabase/tools/verify_cf_origin_spoof_sentinel_live.py

      - name: Live valid student route proof
        run: python ../../04_backend_supabase/tools/verify_student_access_valid_route_live.py

      - name: Set up Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Resolve dependencies
        run: flutter pub get

      - name: Static analysis
        run: flutter analyze

      - name: Widget and unit tests
        run: flutter test

      - name: Web release build preflight
        run: flutter build web --release --base-href /FitNexus_Coach_BlackGold/
