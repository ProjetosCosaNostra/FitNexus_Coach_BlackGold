name: Stage 35 Alert External Delivery Live Proof

on:
  pull_request:
    branches:
      - main
    types:
      - opened
    paths:
      - '04_backend_supabase/stage35_alert_external_delivery_proof_trigger.json'

permissions:
  contents: read

jobs:
  external-delivery-live-proof:
    if: >-
      github.event.action == 'opened' &&
      github.event.pull_request.head.ref == 'blackgold/stage35-alert-external-delivery-proof-trigger' &&
      github.event.pull_request.base.ref == 'main' &&
      github.run_attempt == 1
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact trigger head
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Validate one-shot trigger diff and marker
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import json
          import os
          import subprocess
          from pathlib import Path

          marker_path = Path('04_backend_supabase/stage35_alert_external_delivery_proof_trigger.json')
          expected_path = marker_path.as_posix()
          base = os.environ['BASE_SHA']
          head = os.environ['HEAD_SHA']

          def fail(message: str) -> None:
              raise SystemExit('STAGE35_ALERT_EXTERNAL_DELIVERY_TRIGGER_GUARD=FAIL\n' + message)

          changed = subprocess.check_output(
              ['git', 'diff', '--name-only', f'{base}...{head}'],
              text=True,
          ).splitlines()
          changed = [row.strip() for row in changed if row.strip()]
          if changed != [expected_path]:
              fail(f'trigger PR changed unexpected files: {changed}')

          try:
              marker = json.loads(marker_path.read_text(encoding='utf-8'))
          except Exception as exc:
              fail(f'trigger marker unreadable: {type(exc).__name__}')

          expected = {
              'schema_version': 1,
              'stage': 'STAGE35_ALERT_EXTERNAL_DELIVERY_PROOF_TRIGGER',
              'project_ref': 'mceukeondizkwlpfxzgf',
              'seal_main_sha': base,
              'proof_marker': 'fitnexus-stage34-alert-delivery-proof-v1',
              'proof_reexecution_allowed': False,
              'real_customer_data_allowed': False,
              'launch_gate_promotion': False,
          }
          if marker != expected:
              fail('trigger marker content drifted')

          print('STAGE35_ALERT_EXTERNAL_DELIVERY_TRIGGER_GUARD=PASS')
          print(f'SEAL_MAIN_SHA={base}')
          print(f'TRIGGER_HEAD_SHA={head}')
          print('TRIGGER_DIFF_EXACT=true')
          print('PROOF_REEXECUTION_ALLOWED=false')
          PY

      - name: Require runtime dispatch credential
        shell: bash
        env:
          DISPATCH_TOKEN: ${{ secrets.STUDENT_ACCESS_ALERT_DISPATCH_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${DISPATCH_TOKEN:-}" ]]; then
            echo 'STAGE35_ALERT_RUNTIME_SECRET_GATE=FAIL'
            echo 'MISSING_SECRET=STUDENT_ACCESS_ALERT_DISPATCH_TOKEN'
            exit 1
          fi
          echo '::add-mask::'"$DISPATCH_TOKEN"
          echo 'STAGE35_ALERT_RUNTIME_SECRET_GATE=PASS'

      - name: Prove external Telegram delivery and durable no-replay boundary
        shell: bash
        env:
          DISPATCH_TOKEN: ${{ secrets.STUDENT_ACCESS_ALERT_DISPATCH_TOKEN }}
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import json
          import os
          import urllib.error
          import urllib.request

          endpoint = 'https://mceukeondizkwlpfxzgf.supabase.co/functions/v1/student-access-alert-dispatcher'
          proof_marker = 'fitnexus-stage34-alert-delivery-proof-v1'
          dispatch_token = os.environ.get('DISPATCH_TOKEN', '')

          def fail(message: str) -> None:
              raise SystemExit('STAGE35_ALERT_EXTERNAL_DELIVERY_LIVE_PROOF=FAIL\n' + message)

          if not dispatch_token:
              fail('dispatch credential missing')

          def call() -> tuple[int, dict]:
              body = json.dumps(
                  {'controlled_proof_marker': proof_marker},
                  separators=(',', ':'),
              ).encode('utf-8')
              request = urllib.request.Request(
                  endpoint,
                  data=body,
                  method='POST',
                  headers={
                      'content-type': 'application/json',
                      'accept': 'application/json',
                      'x-fitnexus-alert-dispatch-token': dispatch_token,
                      'user-agent': 'FitNexus-Stage35-Sealed-External-Delivery-Proof/1.0',
                  },
              )
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      status = response.status
                      raw = response.read(16384)
              except urllib.error.HTTPError as exc:
                  status = exc.code
                  raw = exc.read(16384)
              except urllib.error.URLError as exc:
                  fail(f'dispatch endpoint unreachable: {type(exc.reason).__name__}')
              try:
                  value = json.loads(raw.decode('utf-8'))
              except Exception:
                  fail(f'HTTP {status} response is not valid JSON')
              if not isinstance(value, dict):
                  fail(f'HTTP {status} response is not an object')
              return status, value

          status, first = call()
          if status != 200:
              fail(f'first dispatch HTTP {status}, expected 200')
          expected_first = {
              'ok': True,
              'delivered': True,
              'provider': 'telegram_bot_api',
              'attempt_number': 1,
              'controlled_proof_marker': proof_marker,
          }
          mismatches = [key for key, value in expected_first.items() if first.get(key) != value]
          if mismatches:
              fail(f'external provider receipt contract mismatch: {mismatches}')
          signal_id = first.get('signal_id')
          message_id = first.get('provider_message_id')
          if not isinstance(signal_id, int) or signal_id <= 0:
              fail('positive synthetic signal_id missing')
          if not isinstance(message_id, int) or message_id <= 0:
              fail('positive Telegram provider_message_id missing')

          forbidden = {
              'token', 'authorization', 'apikey', 'service_role', 'chat_id',
              'telegram_bot_token', 'network_origin', 'origin_hash', 'subject_key',
              'student_id', 'organization_id', 'link_id', 'raw_provider_response',
          }
          leaked = sorted(forbidden.intersection(first))
          if leaked:
              fail(f'proof response exposed forbidden keys: {leaked}')

          status, second = call()
          if status != 200:
              fail(f'idempotency dispatch HTTP {status}, expected 200')
          if second != {'ok': True, 'delivered': False, 'reason': 'NO_ELIGIBLE_SIGNAL'}:
              fail('second dispatch did not prove terminal durable no-replay behavior')

          print('STAGE35_ALERT_EXTERNAL_DELIVERY_LIVE_PROOF=PASS')
          print('PROVIDER=telegram_bot_api')
          print('PROVIDER_HTTP_200_AND_OK_TRUE=VERIFIED_BY_DEPLOYED_SOURCE')
          print('PROVIDER_MESSAGE_ID_POSITIVE=true')
          print('PROVIDER_DESTINATION_MATCH=VERIFIED_BY_DEPLOYED_SOURCE')
          print('DURABLE_RECEIPT_RECORDED_BEFORE_SUCCESS=true')
          print('SECOND_DISPATCH_PROVIDER_REPLAY=false')
          print('REAL_CUSTOMER_DATA_USED=false')
          print('RAW_PROVIDER_OR_RUNTIME_SECRETS_PRINTED=false')
          print('SYNTHETIC_CLEANUP_REQUIRED=true')
          print('PROOF_REEXECUTION_ALLOWED=false')
          print('INCIDENT_RESPONSE_GATE_PROMOTION=false')
          print('PRODUCTION_DEPLOYMENT_GATE_PROMOTION=false')
          print('PAID_MEDIA_GATE_PROMOTION=false')
          PY
