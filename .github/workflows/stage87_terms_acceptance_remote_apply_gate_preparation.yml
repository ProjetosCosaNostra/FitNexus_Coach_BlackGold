name: Stage87 Terms Acceptance Remote Apply Gate Preparation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify-terms-acceptance-remote-apply-gate-preparation:
    if: github.head_ref == 'blackgold/stage87-terms-acceptance-remote-apply-gate-preparation'
    runs-on: ubuntu-24.04
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Verify Stage87 Terms acceptance remote apply gate preparation
        run: python 04_backend_supabase/tools/verify_stage87_terms_acceptance_remote_apply_gate_preparation.py

      - name: Verify migration ledger contract
        run: python 04_backend_supabase/tools/verify_migration_ledger_contract.py

      - name: Build deterministic Stage87 gate packet twice
        run: |
          python 04_backend_supabase/tools/build_stage87_terms_acceptance_remote_apply_gate_preparation.py --source-sha "$SOURCE_SHA" --output /tmp/stage87_gate_a.json
          python 04_backend_supabase/tools/build_stage87_terms_acceptance_remote_apply_gate_preparation.py --source-sha "$SOURCE_SHA" --output /tmp/stage87_gate_b.json
          cmp /tmp/stage87_gate_a.json /tmp/stage87_gate_b.json
          cp /tmp/stage87_gate_a.json stage87_terms_acceptance_remote_apply_gate_preparation_packet.json

      - name: Upload non-attesting Stage87 gate packet
        uses: actions/upload-artifact@v4
        with:
          name: stage87-terms-acceptance-remote-apply-gate-preparation-${{ github.event.pull_request.head.sha }}
          path: stage87_terms_acceptance_remote_apply_gate_preparation_packet.json
          if-no-files-found: error
          retention-days: 7

      - name: Preserve Stage87 execution and legal boundaries
        run: |
          echo "ONE_SHOT_GATE_PREPARED=true"
          echo "REMOTE_MIGRATION_APPLIED=false"
          echo "SUPABASE_MUTATION=false"
          echo "TERMS_REGISTRY_ROW_CREATED=false"
          echo "REAL_ACCEPTANCE_COLLECTED=false"
          echo "TARGET_DECISION_CLOSED=false"
          echo "LEGAL_TERMS_GATE_READY=false"
          echo "CONTROLLED_LAUNCH=DENIED"
          echo "PAID_MEDIA=DENIED"
