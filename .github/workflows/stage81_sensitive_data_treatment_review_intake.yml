name: Stage81 Sensitive Data Treatment Review Intake

on:
  pull_request:
    branches:
      - main
    paths:
      - "04_backend_supabase/stage81_sensitive_data_treatment_review_intake_authority.json"
      - "04_backend_supabase/tools/collect_stage81_sensitive_data_treatment_review_candidate.py"
      - "04_backend_supabase/tools/verify_stage81_sensitive_data_treatment_review_intake.py"
      - "10_compliance/review/STAGE81_SENSITIVE_DATA_TREATMENT_REVIEW_QUESTIONNAIRE.md"
      - "10_compliance/review/STAGE81_SENSITIVE_DATA_TREATMENT_REVIEW_INPUT_TEMPLATE.json"
      - "04_backend_supabase/stage80r1_registry_pin_reconciliation_authority.json"
      - "10_compliance/inventory/STAGE80_TECHNICAL_SENSITIVE_DATA_MINIMIZATION_REGISTRY.json"
      - "10_compliance/drafts/COMPLIANCE_OPEN_DECISIONS.json"
      - ".github/workflows/stage81_sensitive_data_treatment_review_intake.yml"

permissions:
  contents: read

jobs:
  verify-sensitive-data-review-intake-boundary:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Verify Stage81 sensitive data treatment review intake contract
        run: python 04_backend_supabase/tools/verify_stage81_sensitive_data_treatment_review_intake.py

      - name: Prove committed placeholder sensitive data review input is refused
        shell: bash
        run: |
          set -euo pipefail
          rm -f /tmp/stage81_placeholder_candidate.json /tmp/stage81_placeholder.log
          if python 04_backend_supabase/tools/collect_stage81_sensitive_data_treatment_review_candidate.py \
            --review-input 10_compliance/review/STAGE81_SENSITIVE_DATA_TREATMENT_REVIEW_INPUT_TEMPLATE.json \
            --output /tmp/stage81_placeholder_candidate.json \
            > /tmp/stage81_placeholder.log 2>&1; then
            echo "Committed placeholder sensitive data review input unexpectedly produced a Stage81 candidate" >&2
            exit 1
          fi
          test ! -e /tmp/stage81_placeholder_candidate.json
          grep -F "STAGE81_SENSITIVE_DATA_REVIEW_CANDIDATE=FAIL" /tmp/stage81_placeholder.log >/dev/null
          grep -F "FAILURE_CLASS=BGF-STAGE81-SENSITIVE-DATA-TREATMENT-REVIEW-INTAKE-GUARD-791" /tmp/stage81_placeholder.log >/dev/null
          echo "PLACEHOLDER_SENSITIVE_DATA_REVIEW_INPUT_REFUSED=PASS"

      - name: Upload non-attesting Stage81 review intake boundary
        uses: actions/upload-artifact@v4
        with:
          name: stage81-sensitive-data-treatment-review-intake-${{ github.event.pull_request.head.sha }}
          retention-days: 7
          if-no-files-found: error
          path: |
            04_backend_supabase/stage81_sensitive_data_treatment_review_intake_authority.json
            04_backend_supabase/tools/collect_stage81_sensitive_data_treatment_review_candidate.py
            10_compliance/review/STAGE81_SENSITIVE_DATA_TREATMENT_REVIEW_QUESTIONNAIRE.md
            10_compliance/review/STAGE81_SENSITIVE_DATA_TREATMENT_REVIEW_INPUT_TEMPLATE.json

      - name: Preserve canonical independent acceptance boundary
        run: |
          echo "REAL_EXTERNAL_REVIEW_COLLECTED=false"
          echo "CANONICAL_INDEPENDENT_ACCEPTANCE=false"
          echo "FINAL_LEGAL_CLASSIFICATION_APPROVED=false"
          echo "SENSITIVE_DATA_POLICY_APPROVED=false"
          echo "EXTERNAL_AI_SENSITIVE_DATA_USE_AUTHORIZED=false"
          echo "MARKETING_SENSITIVE_DATA_USE_AUTHORIZED=false"
          echo "TARGET_DECISION_CLOSED=false"
          echo "GATE_PROMOTION=false"
          echo "CONTROLLED_LAUNCH=DENIED"
          echo "REMOTE_MUTATION=false"
