name: Stage75 Technical External Provider Inventory

on:
  pull_request:
    paths:
      - '04_backend_supabase/stage75_technical_external_provider_inventory_authority.json'
      - '04_backend_supabase/tools/build_stage75_technical_external_provider_inventory.py'
      - '04_backend_supabase/tools/verify_stage75_technical_external_provider_inventory.py'
      - '10_compliance/inventory/STAGE75_TECHNICAL_EXTERNAL_SERVICE_SOURCE_REGISTRY.json'
      - '.github/workflows/stage75_technical_external_provider_inventory.yml'
      - '10_compliance/drafts/COMPLIANCE_OPEN_DECISIONS.json'
      - '10_compliance/drafts/PROCESSING_ROLE_MATRIX_CANDIDATE.md'
      - '03_app_flutter/fitnexus_app/pubspec.yaml'
      - '04_backend_supabase/student_access_edge_gateway_authority.json'
      - '04_backend_supabase/student_access_production_edge_selection_authority.json'
      - '04_backend_supabase/cf_origin_spoof_sentinel_authority.json'
      - '04_backend_supabase/student_access_alert_delivery_contract.json'
      - '04_backend_supabase/stage35_alert_external_delivery_cleanup_final_reconciliation_authority.json'
      - '04_backend_supabase/stage39_billing_credential_authority_external_evidence_preparation.json'
      - '04_backend_supabase/stage62_stage61_final_reconciliation_authority.json'
      - '04_backend_supabase/stage66_production_release_candidate_evidence_pipeline_authority.json'
  push:
    branches:
      - main
      - 'blackgold/**'
    paths:
      - '04_backend_supabase/stage75_technical_external_provider_inventory_authority.json'
      - '04_backend_supabase/tools/build_stage75_technical_external_provider_inventory.py'
      - '04_backend_supabase/tools/verify_stage75_technical_external_provider_inventory.py'
      - '10_compliance/inventory/STAGE75_TECHNICAL_EXTERNAL_SERVICE_SOURCE_REGISTRY.json'
      - '.github/workflows/stage75_technical_external_provider_inventory.yml'
      - '10_compliance/drafts/COMPLIANCE_OPEN_DECISIONS.json'
      - '10_compliance/drafts/PROCESSING_ROLE_MATRIX_CANDIDATE.md'
      - '03_app_flutter/fitnexus_app/pubspec.yaml'
      - '04_backend_supabase/student_access_edge_gateway_authority.json'
      - '04_backend_supabase/student_access_production_edge_selection_authority.json'
      - '04_backend_supabase/cf_origin_spoof_sentinel_authority.json'
      - '04_backend_supabase/student_access_alert_delivery_contract.json'
      - '04_backend_supabase/stage35_alert_external_delivery_cleanup_final_reconciliation_authority.json'
      - '04_backend_supabase/stage39_billing_credential_authority_external_evidence_preparation.json'
      - '04_backend_supabase/stage62_stage61_final_reconciliation_authority.json'
      - '04_backend_supabase/stage66_production_release_candidate_evidence_pipeline_authority.json'

permissions:
  contents: read

jobs:
  build-non-attesting-inventory:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify Stage75 provider inventory contract
        run: python 04_backend_supabase/tools/verify_stage75_technical_external_provider_inventory.py

      - name: Build deterministic technical inventory twice
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/stage75"
          python 04_backend_supabase/tools/build_stage75_technical_external_provider_inventory.py \
            --source-sha "${{ github.event.pull_request.head.sha || github.sha }}" \
            --output "$RUNNER_TEMP/stage75/inventory_a.json"
          python 04_backend_supabase/tools/build_stage75_technical_external_provider_inventory.py \
            --source-sha "${{ github.event.pull_request.head.sha || github.sha }}" \
            --output "$RUNNER_TEMP/stage75/inventory_b.json"
          cmp "$RUNNER_TEMP/stage75/inventory_a.json" "$RUNNER_TEMP/stage75/inventory_b.json"

      - name: Upload non-attesting technical provider inventory
        uses: actions/upload-artifact@v4
        with:
          name: stage75-technical-external-provider-inventory-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/stage75/inventory_a.json
          retention-days: 7

      - name: Preserve unresolved provider and legal boundary
        run: |
          echo "LEGAL_SUBPROCESSOR_CLASSIFICATION=false"
          echo "PROVIDER_CONTRACT_EVIDENCE=false"
          echo "PROVIDER_REGION_EVIDENCE=false"
          echo "RETENTION_EVIDENCE=false"
          echo "TRANSFER_MECHANISM_EVIDENCE=false"
          echo "TARGET_DECISION_CLOSED=false"
          echo "EVIDENCE_MIGRATION=false"
          echo "GATE_PROMOTION=false"
          echo "CONTROLLED_LAUNCH=DENIED"
          echo "PAID_MEDIA=DENIED"
          echo "REMOTE_MUTATION=false"
