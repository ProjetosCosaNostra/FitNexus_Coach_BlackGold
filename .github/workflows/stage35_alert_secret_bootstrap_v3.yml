name: Stage 35 Alert Secret Bootstrap V3

on:
  pull_request:
    branches:
      - main
    paths:
      - '04_backend_supabase/tools/Invoke-Stage35AlertSecretBootstrapV3.ps1'
      - '04_backend_supabase/stage35_alert_secret_bootstrap_v3_authority.json'
      - '.github/workflows/stage35_alert_secret_bootstrap_v3.yml'

permissions:
  contents: read

jobs:
  verify-v3:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Parse V3 PowerShell without executing it
        shell: pwsh
        run: |
          $path = '04_backend_supabase/tools/Invoke-Stage35AlertSecretBootstrapV3.ps1'
          [void][scriptblock]::Create((Get-Content -LiteralPath $path -Raw))
          Write-Host 'STAGE35_ALERT_SECRET_BOOTSTRAP_V3_PARSE=PASS'

      - name: Validate management-plane invariants
        shell: pwsh
        run: |
          $path = '04_backend_supabase/tools/Invoke-Stage35AlertSecretBootstrapV3.ps1'
          $source = Get-Content -LiteralPath $path -Raw
          $required = @(
            'Invoke-RestMethod -Method Post -Uri "https://api.supabase.com/v1/projects/$ProjectRef/secrets"',
            'Invoke-RestMethod -Method Get -Uri "https://api.supabase.com/v1/projects/$ProjectRef/secrets"',
            '[ordered]@{ name = ''STUDENT_ACCESS_ALERT_DISPATCH_TOKEN''; value = $dispatchToken }',
            'for ($attempt = 1; $attempt -le 12; $attempt++)',
            'Start-Sleep -Seconds 2',
            'secret set $Name --repo $Repository',
            'STAGE35_ALERT_SECRET_BOOTSTRAP_V3=PASS',
            'DATABASE_MIGRATION_APPLIED=false',
            'EDGE_FUNCTION_DEPLOYED=false',
            'TELEGRAM_PROVIDER_CALLED=false',
            'ONE_SHOT_EXTERNAL_DELIVERY_PROOF_CONSUMED=false'
          )
          foreach ($fragment in $required) {
            if (-not $source.Contains($fragment)) { throw "Missing invariant: $fragment" }
          }
          $forbidden = @(
            'supabase secrets set',
            'supabase@latest',
            '--env-file',
            'https://api.telegram.org',
            'functions deploy',
            'db push',
            'apply_migration'
          )
          foreach ($fragment in $forbidden) {
            if ($source.Contains($fragment)) { throw "Forbidden V3 behavior: $fragment" }
          }
          Write-Host 'STAGE35_ALERT_SECRET_BOOTSTRAP_V3_STATIC_GUARD=PASS'

      - name: Validate V3 authority
        shell: pwsh
        run: |
          $authority = Get-Content '04_backend_supabase/stage35_alert_secret_bootstrap_v3_authority.json' -Raw | ConvertFrom-Json
          if ($authority.failure_class -ne 'BGF-STAGE35-ALERT-SECRET-BOOTSTRAP-SET-READBACK-DIVERGENCE-299') { throw 'Failure class drift' }
          if ($authority.observed_failure.exact_root_cause_proven -ne $false) { throw 'Root cause must remain unclaimed' }
          if ($authority.v3_prevention.same_management_plane_for_write_and_read -ne $true) { throw 'Plane convergence drift' }
          if ($authority.v3_prevention.secret_values_printed -ne $false) { throw 'Secret logging forbidden' }
          if ($authority.gates.external_delivery_proof -ne $false) { throw 'Proof gate must remain closed' }
          if ($authority.gates.production_deployment -ne $false) { throw 'Deployment gate must remain closed' }
          Write-Host 'STAGE35_ALERT_SECRET_BOOTSTRAP_V3_AUTHORITY=PASS'
