name: Android Visual Approval Emulator V1

on:
  push:
    branches:
      - blackgold/mobile-home-premium-redesign-v1
    paths:
      - '03_app_flutter/fitnexus_app/**'
      - '.github/workflows/android_visual_approval_emulator_v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolated-emulator-proof:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 03_app_flutter/fitnexus_app

    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4

      - name: Set up Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Prepare ephemeral visual-only release signing
        shell: bash
        run: |
          set -euo pipefail
          PASSWORD="$(openssl rand -hex 24)"
          KEYSTORE="android/visual-approval-ci.jks"
          keytool -genkeypair \
            -keystore "$KEYSTORE" \
            -storepass "$PASSWORD" \
            -keypass "$PASSWORD" \
            -alias visual_approval \
            -keyalg RSA \
            -keysize 2048 \
            -validity 30 \
            -dname 'CN=FitNexus Visual Approval,O=BlackGold,C=BR' \
            -noprompt >/dev/null 2>&1
          {
            echo "storePassword=$PASSWORD"
            echo "keyPassword=$PASSWORD"
            echo 'keyAlias=visual_approval'
            echo 'storeFile=visual-approval-ci.jks'
          } > android/key.properties
          echo 'VISUAL_SIGNING_MODE=EPHEMERAL_CI_RELEASE_KEY'
          echo 'PLAY_UPLOAD_KEY_USED=false'

      - name: Build exact-SHA production entrypoint APK
        run: flutter build apk --release

      - name: Prepare visual approval entrypoint from exact-SHA app
        shell: bash
        run: |
          set -euo pipefail
          cat > lib/visual_approval_main_ci.dart <<'DART'
          import 'package:flutter/material.dart';
          import 'app/fitnexus_app.dart';

          void main() {
            WidgetsFlutterBinding.ensureInitialized();
            runApp(const FitNexusApp());
          }
          DART
          dart format lib/visual_approval_main_ci.dart

      - name: Build exact-SHA visual approval APK
        run: flutter build apk --release -t lib/visual_approval_main_ci.dart

      - name: Remove ephemeral signing material
        if: always()
        shell: bash
        run: |
          rm -f android/key.properties android/visual-approval-ci.jks

      - name: Boot isolated emulator, install release APK and capture rendered home
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          force-avd-creation: true
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          working-directory: 03_app_flutter/fitnexus_app
          script: |
            set -euo pipefail
            OUT='build/emulator_visual'
            PACKAGE='br.com.lafamigliaplayworks.fitnexuscoach'
            mkdir -p "$OUT"
            adb wait-for-device
            adb shell settings put system accelerometer_rotation 0 || true
            adb shell settings put system user_rotation 0 || true
            adb shell wm size 1080x1920
            adb shell wm density 420
            adb logcat -c || true
            adb install -r build/app/outputs/flutter-apk/app-release.apk
            adb shell am force-stop "$PACKAGE" || true
            adb shell am start -W -n "$PACKAGE/.MainActivity" | tee "$OUT/FITNEXUS_ACTIVITY_START.txt"

            READY=0
            for ATTEMPT in $(seq 1 18); do
              sleep 5
              adb exec-out screencap -p > "$OUT/FITNEXUS_HOME_CANDIDATE.png" || true
              adb shell uiautomator dump /data/local/tmp/fitnexus_ui.xml >/dev/null 2>&1 || true
              adb pull /data/local/tmp/fitnexus_ui.xml "$OUT/FITNEXUS_HOME_UI.xml" >/dev/null 2>&1 || true
              if [ -f "$OUT/FITNEXUS_HOME_UI.xml" ] && grep -Eiq 'FITNEXUS|Sua evolu[cç][aã]o|Come[cç]ar treino|Ecossistema' "$OUT/FITNEXUS_HOME_UI.xml"; then
                READY=1
                echo "FITNEXUS_RENDER_MARKER_FOUND_ATTEMPT=$ATTEMPT"
                break
              fi
              echo "FITNEXUS_RENDER_WAIT_ATTEMPT=$ATTEMPT"
            done

            cp "$OUT/FITNEXUS_HOME_CANDIDATE.png" "$OUT/FITNEXUS_HOME_EXACT_SHA.png" || true
            adb logcat -d > "$OUT/FITNEXUS_HOME_LOGCAT.txt" || true
            adb shell dumpsys package "$PACKAGE" > "$OUT/FITNEXUS_PACKAGE_DUMPSYS.txt" || true
            adb shell dumpsys activity activities > "$OUT/FITNEXUS_ACTIVITY_DUMPSYS.txt" || true

            if [ "$READY" -ne 1 ]; then
              echo 'FITNEXUS_ISOLATED_EMULATOR_VISUAL_PROOF=FAIL_RENDER_MARKER_NOT_FOUND'
              exit 42
            fi

            python - <<'PY'
            import hashlib
            import json
            import os
            import struct
            from pathlib import Path

            out = Path('build/emulator_visual')
            p = out / 'FITNEXUS_HOME_EXACT_SHA.png'
            data = p.read_bytes()
            assert len(data) >= 24 and data[:8] == b'\x89PNG\r\n\x1a\n', 'FITNEXUS_EMULATOR_SCREENSHOT_INVALID_PNG'
            width, height = struct.unpack('>II', data[16:24])
            ui = (out / 'FITNEXUS_HOME_UI.xml').read_text(encoding='utf-8', errors='ignore')
            marker_candidates = ['FITNEXUS', 'Sua evolução', 'Sua evolucao', 'Começar treino', 'Comecar treino', 'Ecossistema']
            matched = [m for m in marker_candidates if m.lower() in ui.lower()]
            assert matched, 'FITNEXUS_RENDER_MARKER_NOT_FOUND_IN_FINAL_UI_DUMP'
            receipt = {
                'schema_version': 2,
                'kind': 'FITNEXUS_ANDROID_ISOLATED_EMULATOR_VISUAL_PROOF',
                'source_commit_sha': os.environ['GITHUB_SHA'],
                'github_run_id': os.environ['GITHUB_RUN_ID'],
                'application_id': 'br.com.lafamigliaplayworks.fitnexuscoach',
                'build_mode': 'release',
                'production_entrypoint_compiled': True,
                'visual_entrypoint': 'lib/visual_approval_main_ci.dart -> FitNexusApp exact-SHA UI/routes/theme',
                'supabase_bootstrap_bypassed_for_visual_capture_only': True,
                'emulator_api_level': 35,
                'requested_viewport': '1080x1920',
                'captured_width': width,
                'captured_height': height,
                'render_markers': matched,
                'screenshot_sha256': hashlib.sha256(data).hexdigest(),
                'play_publication_performed': False,
                'purpose': 'exact_sha_premerge_visual_approval',
            }
            (out / 'FITNEXUS_EMULATOR_VISUAL_RECEIPT_V2.json').write_text(
                json.dumps(receipt, ensure_ascii=False, indent=2) + '\n',
                encoding='utf-8',
            )
            print('FITNEXUS_ISOLATED_EMULATOR_VISUAL_PROOF=PASS')
            print(f'CAPTURED_SIZE={width}x{height}')
            print('RENDER_MARKERS=' + '|'.join(matched))
            print('SCREENSHOT_SHA256=' + receipt['screenshot_sha256'])
            PY

      - name: Upload isolated emulator proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FITNEXUS_EMULATOR_VISUAL_${{ github.sha }}
          path: 03_app_flutter/fitnexus_app/build/emulator_visual/
          if-no-files-found: error
          retention-days: 7
