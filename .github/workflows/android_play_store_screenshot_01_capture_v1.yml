name: Android Play Store Screenshot 01 Capture V1

on:
  pull_request:
    paths:
      - '03_app_flutter/fitnexus_app/android/play_store/PLAY_STORE_SCREENSHOT_01_CAPTURE_V1.json'
      - '03_app_flutter/fitnexus_app/lib/store_capture_main.dart'
      - '03_app_flutter/fitnexus_app/lib/features/professor/professor_coach_action_repository.dart'
      - '03_app_flutter/fitnexus_app/tool/FITNEXUS_PLAY_STORE_SCREENSHOT_01_CAPTURE_V1.ps1'
      - '03_app_flutter/fitnexus_app/tool/FITNEXUS_PLAY_STORE_SCREENSHOT_01_PS51_DIMENSION_REPAIR_V1.ps1'
      - '.github/workflows/android_play_store_screenshot_01_capture_v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate screenshot contract
        shell: python
        run: |
          import json
          from pathlib import Path

          path = Path('03_app_flutter/fitnexus_app/android/play_store/PLAY_STORE_SCREENSHOT_01_CAPTURE_V1.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          assert data['application_id'] == 'br.com.lafamigliaplayworks.fitnexuscoach'
          assert data['capture']['target_width_px'] == 1080
          assert data['capture']['target_height_px'] == 1920
          assert data['capture']['synthetic_data'] is True
          assert data['capture']['production_ui_widget'] == 'ProfessorCoachActionCenterPage'
          assert data['evidence']['current_only'] is True
          for key, value in data['hard_boundaries'].items():
              assert value is False, f'{key} must remain false'
          print('FITNEXUS_PLAY_SCREENSHOT_01_CONTRACT=PASS')

      - name: Validate capture runner without local Android binding
        shell: pwsh
        run: |
          ./03_app_flutter/fitnexus_app/tool/FITNEXUS_PLAY_STORE_SCREENSHOT_01_CAPTURE_V1.ps1 -ValidateOnly

      - name: Guard production/capture isolation and Windows PowerShell 5.1 compatibility
        shell: python
        run: |
          import re
          from pathlib import Path

          entry = Path('03_app_flutter/fitnexus_app/lib/store_capture_main.dart').read_text(encoding='utf-8')
          repo = Path('03_app_flutter/fitnexus_app/lib/features/professor/professor_coach_action_repository.dart').read_text(encoding='utf-8')
          runner = Path('03_app_flutter/fitnexus_app/tool/FITNEXUS_PLAY_STORE_SCREENSHOT_01_CAPTURE_V1.ps1').read_text(encoding='utf-8')
          repair = Path('03_app_flutter/fitnexus_app/tool/FITNEXUS_PLAY_STORE_SCREENSHOT_01_PS51_DIMENSION_REPAIR_V1.ps1').read_text(encoding='utf-8')

          assert 'FITNEXUS_STORE_CAPTURE' in entry
          assert 'fitNexusStoreCaptureMode' in entry
          assert 'Supabase.initialize' not in entry
          assert "bool.fromEnvironment(" in repo
          assert "'FITNEXUS_STORE_CAPTURE'" in repo
          assert 'if (fitNexusStoreCaptureMode)' in repo
          assert '--dart-define=FITNEXUS_STORE_CAPTURE=true' in runner
          assert "'1080x1920'" not in runner or 'TargetWidth = 1080' in runner
          assert 'BUILD_PRODUCTION_RESTORE_APK' in runner
          assert 'RESTORE_PRODUCTION_APK' in runner
          assert 'FAILSAFE_RESTORE_PRODUCTION_APK' in runner
          assert 'Assert-CanonicalReleaseInstalled' in runner
          assert 'FAILSAFE_PRODUCTION_RESTORE=ENABLED' in runner
          assert '$captureInstalled -and -not $productionRestored' in runner
          assert 'PRODUCTION_RELEASE_RESTORED=' in runner
          assert 'SUPABASE_MUTATION_PERFORMED=false' in runner
          assert 'PLAY_CONSOLE_MUTATION_PERFORMED=false' in runner

          forbidden = ['.ArgumentList', 'ForEach-Object -Parallel', '??', '?.']
          hits = [token for token in forbidden if token in runner]
          assert not hits, f'PowerShell 5.1 incompatible token(s): {hits}'

          inline_if_value = re.compile(r'=\s*\(\s*if\s*\(', re.IGNORECASE)
          assert not inline_if_value.search(runner), (
              'PowerShell 5.1 incompatible parenthesized inline-if value detected'
          )
          assert '$localAppDataSdk' in runner
          assert '$userProfileSdk' in runner

          # Windows PowerShell 5.1 preserves [byte] type through shifts in this code path,
          # which truncates 1080 (0x00000438) to 56 and 1920 (0x00000780) to 128.
          # The runtime repair must cast every PNG IHDR byte to [int] before shifting.
          assert 'PS51_PNG_DIMENSION_REPAIR=ACTIVE' in repair
          assert '([int]$Bytes[$Offset]) -shl 24' in repair
          assert '([int]$Bytes[$Offset + 1]) -shl 16' in repair
          assert '([int]$Bytes[$Offset + 2]) -shl 8' in repair
          assert '([int]$Bytes[$Offset + 3])' in repair
          assert 'FITNEXUS_PLAY_STORE_SCREENSHOT_01_CAPTURE_V1.__ps51_fixed_' in repair

          print('FITNEXUS_PLAY_SCREENSHOT_01_ISOLATION_GUARD=PASS')
          print('FITNEXUS_PLAY_SCREENSHOT_01_PS51_INLINE_IF_GUARD=PASS')
          print('FITNEXUS_PLAY_SCREENSHOT_01_FAILSAFE_RESTORE_GUARD=PASS')
          print('FITNEXUS_PLAY_SCREENSHOT_01_PS51_PNG_DIMENSION_GUARD=PASS')
