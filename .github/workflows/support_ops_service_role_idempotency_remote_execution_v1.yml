name: Support Ops Service-Role Idempotency Remote Execution V1

on:
  pull_request:
    branches: [main]
    paths:
      - '04_backend_supabase/operations/SUPPORT_OPS_SERVICE_ROLE_IDEMPOTENCY_REMOTE_EXECUTION_V1.json'
      - '04_backend_supabase/migration_ledger_authority.json'
      - '04_backend_supabase/tools/verify_support_ops_service_role_idempotency_remote_execution_v1.py'
      - '.github/workflows/support_ops_service_role_idempotency_remote_execution_v1.yml'
  push:
    branches:
      - 'blackgold/support-ops-service-role-idempotency-remote-execution-reconciliation-v1'
    paths:
      - '04_backend_supabase/operations/SUPPORT_OPS_SERVICE_ROLE_IDEMPOTENCY_REMOTE_EXECUTION_V1.json'
      - '04_backend_supabase/migration_ledger_authority.json'
      - '04_backend_supabase/tools/verify_support_ops_service_role_idempotency_remote_execution_v1.py'
      - '.github/workflows/support_ops_service_role_idempotency_remote_execution_v1.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v6

      - name: Verify remote execution reconciliation
        run: python 04_backend_supabase/tools/verify_support_ops_service_role_idempotency_remote_execution_v1.py

      - name: Preserve proof and side-effect boundaries
        shell: bash
        run: |
          grep -q '"remote_apply_count": 1' 04_backend_supabase/operations/SUPPORT_OPS_SERVICE_ROLE_IDEMPOTENCY_REMOTE_EXECUTION_V1.json
          grep -q '"sequential_idempotency": "GREEN"' 04_backend_supabase/operations/SUPPORT_OPS_SERVICE_ROLE_IDEMPOTENCY_REMOTE_EXECUTION_V1.json
          grep -q '"synthetic_cleanup": "GREEN"' 04_backend_supabase/operations/SUPPORT_OPS_SERVICE_ROLE_IDEMPOTENCY_REMOTE_EXECUTION_V1.json
          grep -q '"concurrency_idempotency": "NOT_PROVEN"' 04_backend_supabase/operations/SUPPORT_OPS_SERVICE_ROLE_IDEMPOTENCY_REMOTE_EXECUTION_V1.json
          grep -q '"support_ops_primary_migration_reexecuted": false' 04_backend_supabase/operations/SUPPORT_OPS_SERVICE_ROLE_IDEMPOTENCY_REMOTE_EXECUTION_V1.json
          echo 'REMOTE_APPLY_COUNT=1'
          echo 'SEQUENTIAL_IDEMPOTENCY=GREEN'
          echo 'SYNTHETIC_CLEANUP=GREEN'
          echo 'CONCURRENCY_IDEMPOTENCY=NOT_PROVEN'
          echo 'GMAIL_MUTATION=false'
          echo 'PRODUCTION_DEPLOYMENT=false'
          echo 'COMMERCIAL_PROGRESS_CREDIT=0'
