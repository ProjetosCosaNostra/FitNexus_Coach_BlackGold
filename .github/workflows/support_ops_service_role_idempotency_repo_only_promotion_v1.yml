name: Support Ops Service-Role Idempotency Repo-Only Promotion V1

on:
  pull_request:
    branches:
      - main
    paths:
      - '04_backend_supabase/migrations/20260828094000_support_ops_service_role_idempotency_proof.sql'
      - '04_backend_supabase/migration_ledger_authority.json'
      - '04_backend_supabase/operations/SUPPORT_OPS_SERVICE_ROLE_IDEMPOTENCY_REPO_ONLY_PROMOTION_V1.json'
      - '04_backend_supabase/operations/SUPPORT_OPS_SERVICE_ROLE_IDEMPOTENCY_CANDIDATE_V1.json'
      - '04_backend_supabase/operations/candidates/SUPPORT_OPS_SERVICE_ROLE_IDEMPOTENCY_PROOF_CANDIDATE.sql'
      - '04_backend_supabase/tools/verify_support_ops_service_role_idempotency_repo_only_promotion_v1.py'
      - '.github/workflows/support_ops_service_role_idempotency_repo_only_promotion_v1.yml'
  push:
    branches:
      - 'blackgold/support-ops-service-role-idempotency-repo-only-promotion-v1'
    paths:
      - '04_backend_supabase/migrations/20260828094000_support_ops_service_role_idempotency_proof.sql'
      - '04_backend_supabase/migration_ledger_authority.json'
      - '04_backend_supabase/operations/SUPPORT_OPS_SERVICE_ROLE_IDEMPOTENCY_REPO_ONLY_PROMOTION_V1.json'
      - '04_backend_supabase/operations/SUPPORT_OPS_SERVICE_ROLE_IDEMPOTENCY_CANDIDATE_V1.json'
      - '04_backend_supabase/operations/candidates/SUPPORT_OPS_SERVICE_ROLE_IDEMPOTENCY_PROOF_CANDIDATE.sql'
      - '04_backend_supabase/tools/verify_support_ops_service_role_idempotency_repo_only_promotion_v1.py'
      - '.github/workflows/support_ops_service_role_idempotency_repo_only_promotion_v1.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v6

      - name: Compile verifier
        run: python -m py_compile 04_backend_supabase/tools/verify_support_ops_service_role_idempotency_repo_only_promotion_v1.py

      - name: Verify repo-only promotion authority
        run: python 04_backend_supabase/tools/verify_support_ops_service_role_idempotency_repo_only_promotion_v1.py

      - name: Preserve no-side-effect boundary
        shell: bash
        run: |
          grep -q '"repository_promoted": true' 04_backend_supabase/operations/SUPPORT_OPS_SERVICE_ROLE_IDEMPOTENCY_REPO_ONLY_PROMOTION_V1.json
          grep -q '"remote_applied": false' 04_backend_supabase/operations/SUPPORT_OPS_SERVICE_ROLE_IDEMPOTENCY_REPO_ONLY_PROMOTION_V1.json
          grep -q '"remote_proof_execution_authorized": false' 04_backend_supabase/operations/SUPPORT_OPS_SERVICE_ROLE_IDEMPOTENCY_REPO_ONLY_PROMOTION_V1.json
          grep -q '"remote_proof_execution_count": 0' 04_backend_supabase/operations/SUPPORT_OPS_SERVICE_ROLE_IDEMPOTENCY_REPO_ONLY_PROMOTION_V1.json
          echo 'REPO_ONLY_PROMOTION=true'
          echo 'SUPABASE_MUTATION=false'
          echo 'SYNTHETIC_PROOF_EXECUTION=false'
          echo 'GMAIL_MUTATION=false'
          echo 'PRODUCTION_DEPLOYMENT=false'
          echo 'DSR_GATE_CLOSURE=false'
          echo 'COMMERCIAL_PROGRESS_CREDIT=0'
