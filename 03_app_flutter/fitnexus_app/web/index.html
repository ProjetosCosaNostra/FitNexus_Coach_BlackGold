<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
  <meta name="googlebot" content="noindex, nofollow, noarchive, nosnippet">
  <meta name="referrer" content="no-referrer">
  <!--
    Launch remains controlled/blocked. Keep the page non-indexable until the
    legal/privacy/security/payment/deployment admission gates are genuinely
    promoted with evidence.

    Student possession tokens live only inside the URL fragment. The explicit
    no-referrer policy adds a second browser boundary against accidental URL
    disclosure when the student follows external links.

    The base href placeholder is replaced by Flutter's --base-href argument.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="FitNexus Coach BlackGold — gestão de alunos, treinos e acompanhamento para personal trainers.">
  <meta name="theme-color" content="#D4AF37">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="FitNexus">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="icons/Icon-192.png">

  <title>FitNexus Coach BlackGold</title>
  <link rel="manifest" href="manifest.json">

  <style id="fitnexus-construction-notice-style">
    #fitnexus-construction-notice {
      position: fixed;
      z-index: 2147483647;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      max-width: calc(100vw - 24px);
      padding: 9px 16px;
      border: 1px solid #8A7130;
      border-radius: 999px;
      background: rgba(12, 12, 12, 0.96);
      color: #FFD45A;
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.38);
      font-family: Arial, Helvetica, sans-serif;
      font-size: 12px;
      font-weight: 800;
      line-height: 1.25;
      letter-spacing: 0.01em;
      text-align: center;
      pointer-events: none;
      box-sizing: border-box;
    }

    @media (max-width: 620px) {
      #fitnexus-construction-notice {
        top: 8px;
        width: calc(100vw - 20px);
        padding: 8px 12px;
        border-radius: 14px;
        font-size: 11px;
      }
    }
  </style>
</head>
<body>
  <noscript>O FitNexus Coach BlackGold precisa de JavaScript habilitado para funcionar.</noscript>
  
  <div id="fitnexus-construction-notice" role="status" aria-live="polite">
    FITNEXUS COACH — EM CONSTRUÇÃO
  </div>
  <script>
    (function () {
      var el = document.getElementById('fitnexus-construction-notice');
      if (!el) return;
      var lang = (navigator.language || 'en').toLowerCase();
      if (lang.indexOf('pt') === 0) {
        el.textContent = 'FITNEXUS COACH — EM CONSTRUÇÃO • Algumas funções e links ainda não estão disponíveis.';
      } else if (lang.indexOf('es') === 0) {
        el.textContent = 'FITNEXUS COACH — EN CONSTRUCCIÓN • Algunas funciones y enlaces todavía no están disponibles.';
      } else {
        el.textContent = 'FITNEXUS COACH — UNDER CONSTRUCTION • Some features and links are not available yet.';
      }
    }());
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
